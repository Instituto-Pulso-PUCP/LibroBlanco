  <style>

      --panel: #ffffff;

      --ink: #182220;
      --ink-soft: #38443f;
      --muted: #61706b;
      --line: #d7ddda;
      --accent: #33586a;
      --accent-strong: #203c4a;
      --accent-soft: #e4ecef;
      --evidence: #8a6a26;
      --evidence-soft: #f4ead0;
      --evidence-ink: #4d3b14;
      --shadow: 0 18px 46px rgba(20, 30, 27, .10);
      --radius: 9px;
      --serif: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
      --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --meta-soft: #e8edf3;
      --meta-ink: #35485a;
      --chip-soft: #e7ece8;
      --chip-ink: #3c453f;
      --bar-track: #e2e7e4;
      --bar-high: #33586a;
      --bar-mid: #8a6a26;
      --bar-low: #8d968f;
      --proj-badge-bg: #e4ecef;
      --proj-badge-ink: #203c4a;
      --pub-badge-bg: #f4ead0;

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12181a;
        --panel: #1a2224;
        --panel-soft: #1f2a2c;
        --ink: #e7ece9;
        --ink-soft: #c3cdc8;
        --muted: #90a09a;
        --line: #2c3739;
        --accent: #8fb7c9;
        --accent-strong: #b7d6e2;
        --accent-soft: #223338;
        --evidence: #d9ad5e;
        --evidence-soft: #33291a;
        --evidence-ink: #f0d9a8;
        --shadow: 0 18px 46px rgba(0, 0, 0, .38);
        --meta-soft: #212e34;
        --meta-ink: #a9c2d3;
        --chip-soft: #202a27;
        --chip-ink: #b8c4bd;
        --bar-track: #263030;
        --bar-high: #8fb7c9;
        --bar-mid: #d9ad5e;
        --bar-low: #4d5652;
        --proj-badge-bg: #223338;
        --proj-badge-ink: #b7d6e2;
        --pub-badge-bg: #33291a;
        --pub-badge-ink: #f0d9a8;
      }
    }

    :root[data-theme="dark"] {
      --bg: #12181a;
      --panel: #1a2224;
      --panel-soft: #1f2a2c;
      --ink: #e7ece9;
      --ink-soft: #c3cdc8;
      --muted: #90a09a;
      --line: #2c3739;
      --accent: #8fb7c9;
      --accent-strong: #b7d6e2;
      --accent-soft: #223338;
      --evidence: #d9ad5e;
      --evidence-soft: #33291a;
      --evidence-ink: #f0d9a8;
      --shadow: 0 18px 46px rgba(0, 0, 0, .38);
      --meta-soft: #212e34;
      --meta-ink: #a9c2d3;
      --chip-soft: #202a27;
      --chip-ink: #b8c4bd;
      --bar-track: #263030;
      --bar-high: #8fb7c9;
      --bar-mid: #d9ad5e;
      --bar-low: #4d5652;
      --proj-badge-bg: #223338;
      --proj-badge-ink: #b7d6e2;
      --pub-badge-bg: #33291a;
      --pub-badge-ink: #f0d9a8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
    }

    header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 20px;
      align-items: end;
      max-width: 1500px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 27px;
      line-height: 1.15;
      font-weight: 620;
      font-optical-sizing: auto;
      text-wrap: balance;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13.5px;
      max-width: 62ch;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(92px, 1fr));
      gap: 8px;
      min-width: 330px;
    }

    .stat {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: var(--radius);
      padding: 9px 12px;
    }

    .stat strong {
      display: block;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 21px;
      font-weight: 500;
      line-height: 1;
      color: var(--accent-strong);
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .toolbar {
      max-width: 1500px;
      margin: 14px auto 0;
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .tabs {
      display: flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      height: 38px;
    }

    .tabs button {
      border: 0;
      border-radius: 0;
      height: 100%;
    }

    .tabs button.active {
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-weight: 600;
    }

    input[type="search"], select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      font-size: 14px;
    }

    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); color: var(--accent-strong); }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px 28px 28px;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(460px, 1.4fr);
      gap: 16px;
      min-height: calc(100vh - 150px);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-height: 420px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 14px 16px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 16.5px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--ink-soft);
    }

    .panel-body {
      padding: 12px;
      overflow: auto;
      max-height: calc(100vh - 250px);
    }

    .empty {
      color: var(--muted);
      padding: 24px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .row-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 11px 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .row-card:hover,
    .row-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .row-card h3 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 560;
      font-size: 14.5px;
      line-height: 1.3;
    }

    .row-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 7px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 8px;
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
    }

    .badge-proyectos { background: var(--proj-badge-bg); color: var(--proj-badge-ink); }
    .badge-publicaciones { background: var(--pub-badge-bg); color: var(--pub-badge-ink); }
    .badge-fuente { background: var(--meta-soft); color: var(--meta-ink); }

    .score-bar-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
    }

    .score-bar-track {
      flex: 1;
      height: 6px;
      border-radius: 4px;
      background: var(--bar-track);
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 4px;
    }

    .score-label {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
      min-width: 36px;
      text-align: right;
    }

    .detail-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 16px;
      margin-bottom: 14px;
    }

    .detail-card .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .detail-card h2.title {
      margin: 6px 0 8px;
      padding: 0;
      border: 0;
      background: none;
      font-family: var(--serif);
      font-weight: 620;
      font-size: 21px;
      line-height: 1.3;
      text-wrap: balance;
      color: var(--ink);
    }

    .detail-card p {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.55;
    }

    .match-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 13px 14px;
      margin-bottom: 10px;
    }

    .match-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }

    .match-head h3 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 560;
      font-size: 15.5px;
      line-height: 1.35;
    }

    .evidence {
      margin-top: 10px;
      padding: 10px 11px;
      border-left: 3px solid var(--evidence);
      background: var(--evidence-soft);
      color: var(--evidence-ink);
      font-family: var(--serif);
      font-style: italic;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .evidence-meta {
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    @media (max-width: 1080px) {
      main { grid-template-columns: 1fr; }
      .panel-body { max-height: none; }
      header { position: static; }
      .topbar, .toolbar { grid-template-columns: 1fr; }
      .stats { min-width: 0; }
    }
  </style>
</head>

, {"doc_id": "PP_0147", "fuente": "PP", "fuente_label": "Programa Presupuestal", "titulo": "Fortalecimiento de la Educacion Superior Tecnologica", "n_chunks": 1, "top_topic_matches": []}, {"doc_id": "PP_0148", "fuente": "PP", "fuente_label": "Programa Presupuestal", "titulo": "Reduccion del Tiempo Inseguridad y Costo Ambiental en el Tra", "n_chunks": 1, "top_topic_matches": [{"topic_id": "proj_039", "source": "proyectos", "normalized_topic": "Paisaje sonoro y movilidad urbana", "score": 0.4311}]}, {"doc_id": "PP_0149", "fuente": "PP", "fuente_label": "Programa Presupuestal", "titulo": "Mejora del Desempeño en las Contrataciones Publicas", "n_chunks": 1, "top_topic_matches": []}, {"doc_id": "PP_0150", "fuente": "PP", "fuente_label": "Programa Presupuestal", "titulo": "Incremento en el Acceso de la Poblacion a los Servicios Educ", "n_chunks": 1, "top_topic_matches": []}, {"doc_id": "PP_0151", "fuente": "PP", "fuente_label": "Programa Presupuestal", "titulo": "Reduccion de la Corrupcion en el USO de los Recursos Publico", "n_chunks": 1, "top_topic_matches": []}, {"doc_id": "PP_1001", "fuente": "PP", "fuente_label": "Programa Presupuestal", "titulo": "Productos Especificos Para Desarrollo Infantil Temprano", "n_chunks": 1, "top_topic_matches": []}, {"doc_id": "PP_1002", "fuente": "PP", "fuente_label": "Programa Presupuestal", "titulo": "Productos Especificos Para Reduccion de la Violencia Contra", "n_chunks": 1, "top_topic_matches": [{"topic_id": "proj_033", "source": "proyectos", "normalized_topic": "Química de coordinación y materiales inorgánicos funcionales", "score": 0.1428}]}]};
    const state = { mode: 'topics', query: '', sourceFilter: '', selectedTopicId: '', selectedDocId: '' };

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeText(value) {
      return String(value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    const topicsById = new Map(DATA.topics.map(t => [t.topic_id, t]));
    const policiesById = new Map(DATA.policies.map(p => [p.doc_id, p]));

    function bestScore(topic) {
      return topic.top_policy_matches.length ? topic.top_policy_matches[0].score : 0;
    }

    function scoreColorVar(score) {
      if (score >= 0.45) return 'var(--bar-high)';
      if (score >= 0.30) return 'var(--bar-mid)';
      return 'var(--bar-low)';
    }

    function scoreBar(score, maxScore) {
      const pct = Math.max(3, Math.min(100, (score / maxScore) * 100));
      return `
        <div class="score-bar-wrap">
          <div class="score-bar-track"><div class="score-bar-fill" style="width:${pct}%; background:${scoreColorVar(score)};"></div></div>
          <span class="score-label">${score.toFixed(2)}</span>
        </div>
      `;
    }

    function renderStats() {
      document.getElementById('statTopics').textContent = DATA.metadata.num_topics;
      document.getElementById('statPolicies').textContent = DATA.metadata.num_policy_docs;
      document.getElementById('statModel').textContent = DATA.metadata.embedding_model;
      document.getElementById('subtitleText').textContent = DATA.metadata.note;
    }

    function setMode(mode) {
      state.mode = mode;
      state.selectedTopicId = '';
      state.selectedDocId = '';
      document.getElementById('tabTopics').classList.toggle('active', mode === 'topics');
      document.getElementById('tabPolicies').classList.toggle('active', mode === 'policies');
      document.getElementById('listTitle').textContent = mode === 'topics' ? 'Temas de investigación' : 'Políticas nacionales';
      document.getElementById('sourceFilter').classList.toggle('hidden', mode === 'policies');
      document.getElementById('detailPanel').innerHTML = '<div class="empty">Selecciona un tema o una política para ver su alineación.</div>';
      renderList();
    }

    function renderList() {
      const root = document.getElementById('listPanel');
      const query = normalizeText(state.query);
      root.innerHTML = '';
      let visible = 0;

      if (state.mode === 'topics') {
        const items = DATA.topics.slice().sort((a, b) => bestScore(b) - bestScore(a));
        items.forEach(topic => {
          if (state.sourceFilter && topic.source !== state.sourceFilter) return;
          const haystack = normalizeText([topic.normalized_topic, topic.description].join(' '));
          if (query && !haystack.includes(query)) return;
          visible += 1;
          const card = document.createElement('article');
          card.className = 'row-card' + (state.selectedTopicId === topic.topic_id ? ' active' : '');
          const badgeClass = topic.source === 'proyectos' ? 'badge-proyectos' : 'badge-publicaciones';
          const pubBadge = topic.num_publications !== undefined
            ? `<span class="badge badge-publicaciones">${topic.num_publications} publicaciones</span>`
            : '';
          card.innerHTML = `
            <h3>${escapeHtml(topic.normalized_topic)}</h3>
            <div class="row-meta">
              <span class="badge ${badgeClass}">${escapeHtml(topic.source)}</span>
              <span class="badge badge-fuente">${topic.count || 0} variantes</span>
              ${pubBadge}
            </div>
            ${scoreBar(bestScore(topic), 0.7)}
          `;
          card.addEventListener('click', () => selectTopic(topic.topic_id));
          root.appendChild(card);
        });
      } else {
        const items = DATA.policies.slice().sort((a, b) => {
          const sa = a.top_topic_matches.length ? a.top_topic_matches[0].score : 0;
          const sb = b.top_topic_matches.length ? b.top_topic_matches[0].score : 0;
          return sb - sa;
        });
        items.forEach(policy => {
          const haystack = normalizeText([policy.titulo, policy.fuente_label].join(' '));
          if (query && !haystack.includes(query)) return;
          visible += 1;
          const topScore = policy.top_topic_matches.length ? policy.top_topic_matches[0].score : 0;
          const card = document.createElement('article');
          card.className = 'row-card' + (state.selectedDocId === policy.doc_id ? ' active' : '');
          card.innerHTML = `
            <h3>${escapeHtml(policy.titulo)}</h3>
            <div class="row-meta">
              <span class="badge badge-fuente">${escapeHtml(policy.fuente)}</span>
              <span class="badge badge-fuente">${policy.n_chunks} chunks</span>
            </div>
            ${scoreBar(topScore, 0.7)}
          `;
          card.addEventListener('click', () => selectPolicy(policy.doc_id));
          root.appendChild(card);
        });
      }

      if (!visible) {
        root.innerHTML = '<div class="empty">No hay resultados que coincidan con la búsqueda.</div>';
      }
    }

    function selectTopic(topicId) {
      state.selectedTopicId = topicId;
      renderList();
      const topic = topicsById.get(topicId);
      const panel = document.getElementById('detailPanel');
      const badgeClass = topic.source === 'proyectos' ? 'badge-proyectos' : 'badge-publicaciones';
      const matches = topic.top_policy_matches.map(m => `
        <div class="match-card">
          <div class="match-head">
            <h3>${escapeHtml(m.titulo)}</h3>
            <span class="badge badge-fuente">${escapeHtml(m.fuente)}</span>
          </div>
          ${scoreBar(m.score, 0.7)}
          <div class="evidence">${escapeHtml(m.evidence_text)}</div>
          <div class="evidence-meta">chunk ${escapeHtml(m.evidence_chunk_id)} · páginas ${escapeHtml((m.evidence_paginas || []).join(', '))}</div>
        </div>
      `).join('');
      const pubBadge = topic.num_publications !== undefined
        ? `<span class="badge badge-publicaciones">${topic.num_publications} publicaciones</span>`
        : '';
      const pubList = (topic.publication_topics && topic.publication_topics.length)
        ? `
        <div class="detail-card" style="background:transparent; border:0; box-shadow:none; padding:0 2px;">
          <div class="label">Temas de publicaciones agrupados aquí (${topic.publication_topics.length})</div>
        </div>
        <div class="detail-card">
          <ul style="margin:0; padding-left:18px;">
            ${topic.publication_topics.map(p => `
              <li>${escapeHtml(p.publication_topic)} — ${p.count} ${p.count === 1 ? 'paper' : 'papers'}</li>
            `).join('')}
          </ul>
        </div>
      ` : '';
      panel.innerHTML = `
        <div class="detail-card">
          <div class="label">Tema normalizado</div>
          <h2 class="title">${escapeHtml(topic.normalized_topic)}</h2>
          <p>${escapeHtml(topic.description)}</p>
          <div class="row-meta" style="margin-top:10px;">
            <span class="badge ${badgeClass}">${escapeHtml(topic.source)}</span>
            <span class="badge badge-fuente">${topic.count || 0} variantes agrupadas</span>
            ${pubBadge}
          </div>
        </div>
        ${pubList}
        <div class="detail-card" style="background:transparent; border:0; box-shadow:none; padding:0 2px;">
          <div class="label">Políticas mejor alineadas</div>
        </div>
        ${matches}
      `;
    }

    function selectPolicy(docId) {
      state.selectedDocId = docId;
      renderList();
      const policy = policiesById.get(docId);
      const panel = document.getElementById('detailPanel');
      const matches = policy.top_topic_matches.map(m => {
        const badgeClass = m.source === 'proyectos' ? 'badge-proyectos' : 'badge-publicaciones';
        return `
        <div class="match-card">
          <div class="match-head">
            <h3>${escapeHtml(m.normalized_topic)}</h3>
            <span class="badge ${badgeClass}">${escapeHtml(m.source)}</span>
          </div>
          ${scoreBar(m.score, 0.7)}
        </div>
      `;
      }).join('');
      panel.innerHTML = `
        <div class="detail-card">
          <div class="label">${escapeHtml(policy.fuente_label)}</div>
          <h2 class="title">${escapeHtml(policy.titulo)}</h2>
          <div class="row-meta">
            <span class="badge badge-fuente">${escapeHtml(policy.doc_id)}</span>
            <span class="badge badge-fuente">${policy.n_chunks} chunks</span>
          </div>
        </div>
        <div class="detail-card" style="background:transparent; border:0; box-shadow:none; padding:0 2px;">
          <div class="label">Temas de investigación mejor alineados</div>
        </div>
        ${matches || '<div class="empty">Sin temas destacados para esta política.</div>'}
      `;
    }

    document.getElementById('tabTopics').addEventListener('click', () => setMode('topics'));
    document.getElementById('tabPolicies').addEventListener('click', () => setMode('policies'));
    document.getElementById('searchBox').addEventListener('input', event => {
      state.query = event.target.value.trim();
      renderList();
    });
    document.getElementById('sourceFilter').addEventListener('change', event => {
      state.sourceFilter = event.target.value;
      renderList();
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      state.query = '';
      state.sourceFilter = '';
      document.getElementById('searchBox').value = '';
      document.getElementById('sourceFilter').value = '';
      setMode('topics');
    });

    renderStats();
    setMode('topics');
  </script>
