<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador de temas — Proyectos PUCP</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --panel: #ffffff;
      --panel-soft: #f9f7f1;
      --ink: #24211d;
      --muted: #6c665f;
      --line: #ddd6c9;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --gold: #b7791f;
      --rose: #9f3a54;
      --blue: #315f8f;
      --shadow: 0 18px 50px rgba(42, 35, 24, .12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }

    header {
      padding: 22px 28px 16px;
      border-bottom: 1px solid var(--line);
      background: #fffdf8;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 20px;
      align-items: end;
      max-width: 1600px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 750;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .note {
      max-width: 1600px;
      margin: 10px auto 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff8e8;
      color: #5c4519;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(92px, 1fr));
      gap: 8px;
      min-width: 330px;
    }

    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 10px 12px;
    }

    .stat strong {
      display: block;
      font-size: 20px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      max-width: 1600px;
      margin: 14px auto 0;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    input[type="search"], select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      font-size: 14px;
    }

    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); color: var(--accent-strong); }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 18px 28px 28px;
      display: grid;
      grid-template-columns: minmax(360px, 1.1fr) minmax(420px, 1.3fr) minmax(360px, .9fr);
      gap: 16px;
      min-height: calc(100vh - 142px);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-height: 420px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 15px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .panel-body {
      padding: 12px;
      overflow: auto;
      max-height: calc(100vh - 245px);
    }

    .proj {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      background: #fff;
    }

    .proj-header {
      width: 100%;
      min-height: 52px;
      height: auto;
      border: 0;
      border-radius: 0;
      background: #fff;
      text-align: left;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
      -webkit-appearance: none;
      appearance: none;
      font: inherit;
      color: inherit;
    }

    .proj-header:hover,
    .proj.open .proj-header {
      background: #f0faf8;
      color: var(--ink);
    }

    .proj-title {
      display: block;
      font-weight: 700;
      line-height: 1.25;
      font-size: 14px;
    }

    .proj-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 650;
      background: #e8f4f2;
      color: var(--accent-strong);
      white-space: nowrap;
    }

    .topic-list {
      display: none;
      padding: 0 10px 10px 24px;
    }

    .proj.open .topic-list { display: block; }

    .topic-row {
      position: relative;
      border-left: 2px solid var(--line);
      padding: 8px 8px 8px 14px;
      cursor: pointer;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.3;
    }

    .topic-row::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 15px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }

    .topic-row:hover,
    .topic-row.active {
      background: #fff8e8;
      border-left-color: var(--gold);
    }

    .flow {
      min-height: 100%;
      padding: 12px;
    }

    .empty {
      color: var(--muted);
      padding: 24px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .flow-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 14px;
    }

    .flow-card + .arrow {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 24px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .flow-card h3 {
      margin: 5px 0 8px;
      font-size: 18px;
      line-height: 1.25;
    }

    .flow-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .evidence {
      margin-top: 10px;
      padding: 10px;
      border-left: 3px solid var(--gold);
      background: #fff8e8;
      color: #5c4519;
      font-size: 13px;
      line-height: 1.45;
    }

    .confidence {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .normalized-grid {
      display: grid;
      gap: 10px;
    }

    .norm-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 11px 12px;
      cursor: pointer;
    }

    .norm-card:hover,
    .norm-card.active {
      border-color: var(--accent);
      background: #f0faf8;
    }

    .norm-card h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.25;
    }

    .norm-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .mini {
      display: inline-flex;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 11px;
      background: #eef2f7;
      color: #3b4b5c;
    }

    .variant-list {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      border-radius: 999px;
      background: #f1eee6;
      padding: 4px 8px;
      font-size: 12px;
      color: #51483e;
    }

    .hidden { display: none !important; }

    @media (max-width: 1180px) {
      main {
        grid-template-columns: 1fr;
      }
      .panel-body {
        max-height: none;
      }
      header { position: static; }
      .topbar, .toolbar {
        grid-template-columns: 1fr;
      }
      .stats {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Explorador de temas — Proyectos PUCP</h1>
        <div class="subtitle">Proyecto → tema extraído (con evidencia) → tema normalizado</div>
      </div>
      <div class="stats">
        <div class="stat"><strong id="statProjects">0</strong><span>proyectos</span></div>
        <div class="stat"><strong id="statTopics">0</strong><span>temas extraídos</span></div>
        <div class="stat"><strong id="statNorms">0</strong><span>temas normalizados</span></div>
      </div>
    </div>
    <div class="note" id="metaNote"></div>
    <div class="toolbar">
      <input id="searchBox" type="search" placeholder="Buscar proyecto, tema, evidencia o tema normalizado">
      <select id="normFilter">
        <option value="">Todos los temas normalizados</option>
      </select>
      <button id="resetBtn" type="button">Restablecer</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Proyectos y temas extraídos</h2>
      <div id="projectTree" class="panel-body"></div>
    </section>

    <section class="panel">
      <h2>Conexión seleccionada</h2>
      <div id="flowPanel" class="panel-body flow">
        <div class="empty">Selecciona un tema extraído o un tema normalizado para ver su trazabilidad.</div>
      </div>
    </section>

    <section class="panel">
      <h2>Temas normalizados</h2>
      <div id="normalPanel" class="panel-body"></div>
    </section>
  </main>

  <script>
    const DATA = {"metadata": {"dataset_title": "Proyectos de investigación PUCP cerrados (2010-2020) — muestra piloto", "source_file": "salidas/01_projects_closed_con_cris.csv", "num_projects": 36, "num_extracted_topics": 67, "num_normalized_topics": 18, "note": "Muestra piloto estratificada por unidad ejecutora (36 de 983 proyectos cerrados 2010+ con cris_abstract disponible). Extraccion y normalizacion de temas realizadas siguiendo la metodologia del explorador de referencia (topic -> descripcion -> evidencia -> confianza; agrupacion en temas normalizados con trazabilidad completa). Pendiente: escalar al universo completo (983 proyectos) mediante llamadas a un LLM por script, y aplicar el contraste con un objetivo (ODS / plan CEPLAN) una vez definido — ver docs/topic_normalization_pipeline.md."}, "projects": [{"title": "MODELIZACIÓN MATEMÁTICA Y TECNOLOGÍA DIGITAL: UNA PROPUESTA PARA FAVORECER LA ARTICULACIÓN DE LOS DOMINIOS DE LA GEOMETRÍA Y DEL ANÁLISIS EN LA FORMACIÓN CONTINUA DEL PROFESOR.", "year": "2019", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Naturales", "executing_unit": "Departamento de Ciencias", "executing_section": "Matemáticas", "funding_type": "INTERNO", "research_lines": ["Currículo y didáctica", "Formación Universitaria"], "text": "El proyecto se circunscribe a la disciplina científica de didáctica de la matemática y vincula dos líneas de investigación importantes del área como son tecnologías y formación de profesores de matemática. En este contexto, es de nuestro interés realizar una investigación que integre la modelización matemática y la tecnología digital en una propuesta para favorecer la articulación de los dominios de la geometría y del análisis en la formación continua del profesor de matemática. En cuanto a la propuesta tiene como sustento teórico el Espacio de Trabajo Matemático (ETM) y la Ingeniería Didáctica como metodología. Por ello, en el estado del arte se presentan investigaciones relacionadas al ETM, la modelización, la tecnología digital y la formación de profesores de matemática. Con esta investigación se espera contribuir con la formación continua de profesores de matemática mediante un trabajo que tiene una mirada internacional; potenciar el área en el Perú y; desde la investigación, avanzar en cuanto a la constitución de un marco que conecte el ciclo de modelización, el ETM y el ciclo de matematización. Además, se considera necesario consolidar los vínculos ya establecidos con investigadores de la Pontificia Universidad Católica de Valparaíso (PUCV/Chile) y del Laboratorio de Didáctica André Revuz- Universidad de Paris Diderot (Francia) que comparten los mismos intereses de investigación que nosotros.\n\nEducación matemática; Modelización matemática; Tecnología digital; Formación docente\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "872"}, {"title": "MODELOS DE REGRESION EN EL INTERVALO UNITARIO CON APLICACIONES EN EL ANÁLISIS DE RESULTADOS ELECTORALES", "year": "2011", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Ciencias", "executing_section": "Matemáticas", "funding_type": "INTERNO", "research_lines": [], "text": "Los modelos de regresión son modelos estadísticos usados para predecir la probabilidad de una respuesta en función de diversos predictores. Este tipo de modelo, frecuentemente usado en análisis político y otras áreas, supone un error que es considerado de distribución normal. Cuando se restringe al intervalo unitario (intervalo de valores de 0 a 1) se tienen como casos particulares los modelos de proporciones y los modelos de respuesta binaria. En este ultimo caso se considera un enlace entre los predictores y las probabilidades siendo el más común el enlace simétrico logit. Sin embargo este tipo de suposiciones son restrictivas y no aplicables para situaciones con asimetría, datos limitados, exceso de ceros y presencia de censura. El problema de uso de enlaces asimétricos fue abordado, en parte, en el proyecto DAI 3412 y DAI4031 y consolidado en el proyecto DAI 2009-033, proponiendo modelos alternativos e implementado computacionalmente otros propuestos. Algunos modelos para datos limitados, es decir que toman valores con un rango definido en el intervalo 0 a 1 como es el caso de las proporciones, han sido abordados en el proyecto DGI coordinado por Dr. Luis Valdivieso en actual desarrollo. La presencia de censura y exceso de ceros es abordado en recientes trabajos como los de Chai and Bailey (2008) y Branscum, Johnson y Thurmond. (2007). En este proyecto en la línea de los proyectos DAI y DGI citados se propone desarrollar modelos de regresión para variables en el intervalo unitario que contemple la regresión binaria y la regresión de proporciones con respuesta limitada y con exceso de ceros. El contexto en el que este tipo de datos será empleado es en el análisis electoral, específicamente para modelar la proporción obtenida por un determinado partido o movimiento político en una determinada elección a nivel de departamentos, provincias y distritos del país considerando diversas características socio económicas (por ejemplo niveles de pobreza,\n\nModelos de regresión; Datos proporcionales; Resultados electorales; Estadística aplicada\n\nNatural sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "139"}, {"title": "CARACTERIZACIÓN ÓPTICA Y DE EMISIÓN ÓPTICA DE PELÍCULAS DELGADAS AMORFAS DE MATERIALES SEMICONDUCTORES CON UN AMPLIO ANCHO DE BANDA SIC:H, ALN, SIN DOPADAS CON TIERRAS RARAS PARA APLICACIONES OPTOELECTRÓNICAS.", "year": "2014", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Ciencias", "executing_section": "Física", "funding_type": "INTERNO", "research_lines": ["Ciencia de materiales y materia condensada"], "text": "Los materiales con un amplio ancho de banda como nitruro de silicio (Si3N4) o nitruro de aluminio (AlN) son de creciente interés en investigación y desarrollo para aplicaciones ópticas. Esto se debe a que estos materiales exhiben propiedades como un alto voltaje de ruptura, alta conductividad térmica, en contraste con los semiconductores usuales GaAs y Si. Adicionalmente, un amplio ancho de banda permite la transmisión de luz en el espectro visible, esta característica no solo es atractiva en un semiconductor, sino que al dopar estos semiconductores con iones de tierras raras también permiten la emisión de luz a temperatura de ambiente, cubriendo por ejemplo los colores básicos azul (Tm3+), verde (Tb3+) y rojo (Eu3+). De otro lado, es posible hacer ¿ingeniería del ancho de banda¿, variando la proporción (x) de los materiales como por ejemplo en el compuesto Al1 xSixN. Ello abre la posibilidad de manipular las propiedades de emisión, como ya fue demostrado por otro grupo en el sistema Al1-xGaxN y por nuestro grupo en el sistema (SiC)1-x(AlN)x. Las contrapartes amorfas (a-SiC, a-SiN y a-AlN) tienen la ventaja de ser producidas de manera simple y menos costosa que las cristalinas, sin la desventaja de perder importantes propiedades propias de los cristales. Adicionalmente, hay aspectos que difieren del caso cristalino. Por ejemplo, el carácter indirecto de las transiciones en c Si3N4 está ausente en el caso amorfo, por lo que las aplicaciones en optoelectrónica parecen prometedoras. En el caso de a-AlN incluso sería posible pensar en aplicaciones cerca de la región ultravioleta, debido a su amplio ancho de banda, de 6 eV.\n\nPelículas Delgadas; Semiconductores; Tierras Raras; Optoelectrónica\n\nNatural sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "547"}, {"title": "ELABORACION DE NUEVOS HIDROGELES SENSIBLES A LA TEMPERATURA Y AL PH CON ESTABILIDAD MECANICA", "year": "2017", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Naturales", "executing_unit": "Departamento de Ciencias", "executing_section": "Física", "funding_type": "INTERNO", "research_lines": ["Modelamiento, experimentación y simulación"], "text": "SE ELABORARON NUEVOS HIDROGELES A PARTIR DE LA DIMETILACRILAMIDA Y MACROMONOMEROS DE 2-OXAZOLINAS Y N-ISOPROPILACRILAMIDA. ESTOS MATERIALES MOSTRARON SENSIBILIDAD A CAMBIOS DE TEMPERATURA Y CAMBIOS DE pH DEL MEDIO. tAMBIEN TUVIERON LA CAPACIDAD DE ABSORBER PIGMENTOS POR EJEMPLO EL AZUL DE METILENO, PIGMENTO USADO EN LA INDUSTRIA TEXTIL Y QUE APARECE COMO IMPUREZA EN LAS AGUAS RESIDUALES DE ESTE TIPO DE INDUSTRIA.\n\nHidrogeles; Termosensibilidad; Sensibilidad al pH; Estabilidad mecánica\n\nNatural sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "805"}, {"title": "BANDGAP ENGINEERING AND PASSIVATION PROPERTIES OF AMORPHOUS SINX AND SINX:O:H GROWN BY RF-MAGNETRON SPUTTERING", "year": "2017", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Naturales", "executing_unit": "Departamento de Ciencias", "executing_section": "Física", "funding_type": "INTERNO", "research_lines": ["Altas energías"], "text": "Amorphous wide-bandgap semiconductors have attracted attention in the past decades. The reasons for this are twofold. First, these materials are suitable for applications in opto-electronic devices. For instance, a-SiC:H is currently a candidate to serve as photo-electrode in photo-electrochemical devices for hydrogen production [Zhu10]. Additionally, the interface between c-Si and amorphous silicon oxides/nitrides is of profound interest due to its numerous applications in microelectronics and energy conversion devices. Second, the modeling of several properties is very challenging and also they are very different from their crystalline counterpart. One important difference between amorphous and crystalline materials lay in the band-tail states. The origin of these tail states and how they merge into the extended conduction and valence band states is a still an unresolved issue. Band-to-band transitions are responsible for the main absorption and are the primary measure of the optical bandgap energy. Currently, the most prominent model for the fundamental absorption due to its easy implementation is the Tauc approach from which the Tauc-gap is calculated. However it is sensitive to both, band-tails states and the separation of the mobility edges. Furthermore it is not possible to systematically determine the fundamental absorption region from single absorption measurements due to the presence of the large band-tail states which overlap to the fundamental absorption in the typical measured spectral region. In the present one year project we attempt to produce and characterize a-SiNx and a-SiNx:O:H in the whole nitrogen composition range. Motivated by the recent publications [Gue16, Lie15] and [Sei11], we aim to tailor the optical bandgap of this material by manipulating its stoichiometry and then tune its electronic and optical properties by the incorporation of hydrogen and oxygen during the deposition process in order to improve its passivation qualities.\n\nIngeniería de banda prohibida; Pasivación; SiNx; Pulverización catódica\n\nEngineering and technology", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "818"}, {"title": "ESTUDIO DE MECANISMOS DE BIOADHESIÓN EN MATERIALES POLIMÉRICOS NANOESTRUCTURADOS DE ORIGEN BIOLÓGICO", "year": "2012", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Ingeniería", "executing_section": "Mecánica", "funding_type": "INTERNO", "research_lines": [], "text": "El proyecto estudió los mecanismos de adhesión que ocurren en sistemas biológicos, como la adhesión de la seda de araña y la adhesión de proteínas animales como el colágeno. Los resultados del proyecto permitieron caracterizar ciertas propiedades de los adhesivos y de los sistemas en los que estos adhesivos están presentes. Se usó microscopía de fuerza atómica para hallar el módulo de elasticidad del adhesivo de la seda y se verificó que cumple con el criterio de Dalhquist. Además, se midieron las propiedades térmicas de bioadhesivos de colágeno que fueron comparados con las propiedades de adhesivos sintéticos. Este estudio contribuyó a comprender los principios de las propiedades de materiales nanoestructurados presentes en la naturaleza, como el nácar que está formado por nanoplacas de aragonita unidas por bioadhesivos. Además, también se contribuyó con el desarrollo de nuevos adhesivos de origen natural, no tóxicos, para aplicaciones en biomedicina como adhesivo de tejidos, sensores para el reconocimiento molecular, transporte de fármacos en lugares específicos, entre otros.\n\nBioadhesión; Polímeros nanoestructurados; Biomateriales; Ciencia de superficies\n\nEngineering and technology", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "295"}, {"title": "ESTUDIO Y DESARROLLO DE PROCESOS DE SINTERIZADO EN MATERIALES COMPUESTOS DE PLÁSTICO RECICLADO Y MADERA RECUPERADA PARA LA FABRICACIÓN DE PIEZAS DE FORMAS DIVERSAS, ECONÓMICAMENTE VIABLE PARA LA INDUSTRIA", "year": "2013", "project_type": "aplicada", "knowledge_area": "Ingeniería y Tecnología", "executing_unit": "Departamento de Ingeniería", "executing_section": "Mecánica", "funding_type": "EXTERNO", "research_lines": ["Ciencia de materiales y materia condensada"], "text": "La contaminación ambiental producida por los residuos sólidos, sumado al incipiente desarrollo tecnológico de los procesos de fabricación de materiales compuestos de madera y plástico que incluyan los residuos de ambos, son los problemas más relevantes que impulsaron el desarrollo del presente proyecto y sus precedentes. En esta perspectiva, un equipo de investigadores de la Pontificia Universidad Católica del Perú (PUCP) realizó el estudio y desarrollo de procesos de sinterizado en materiales compuestos de polipropileno (PP) y polietileno de alta densidad (HDPE) reciclados y madera capirona (MC) recuperada, para la fabricación de piezas de formas diversas; considerando factores técnicos y económicos. A partir de los resultados de la investigación es posible fabricar piezas complejas por sinterizado de partículas de madera y plástico, gracias a la determinación de los parámetros que permiten obtener el material compuesto con las mejores propiedades: buenas propiedades mecánicas, bajo peso específico, resistencia y rigidez específicas regulables, con buena resistencia química y a los insectos, bajo nivel de absorción de agua y buena estabilidad dimensional, empleando procesos de moldeo con presión y sin presión ya existentes en la industria. El aporte incluye el diseño y fabricación propia de equipos de moldeo por compresión y moldeo rotacional con sistemas de control de parámetros, gracias a los cuales se fabricaron las muestras que se ensayaron y que permitirán continuar la investigación con otros tipos de polímeros y maderas.\n\nSinterizado; Plástico reciclado; Madera recuperada; Materiales compuestos\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "403"}, {"title": "USO DE PROMEDIADO ANGULAR COMPLETO PARA MEJORAR LA PRECISIÓN DE LA ESTIMACIÓN CUANTITATIVA DE ATENUACIÓN ULTRASÓNICA", "year": "2012", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Ingeniería", "executing_section": "Electricidad y Electrónica", "funding_type": "INTERNO", "research_lines": [], "text": "El cáncer de mama es la mayor causa de mortandad por cáncer en mujeres a nivel mundial. La herramienta estándar para la detección de lesiones en mamas es la mamografía, pero otras técnicas complementarias son normalmente requeridas para mejorar la sensitividad y especificidad del diagnóstico mamográfico. El ultrasonido es una de estas herramientas, pero su éxito es limitado debido entre otros motivos al carácter cualitativo y mecanismo de contraste limitado de las imágenes ecográficas. Recientemente, parte de la atención de la comunidad de investigación en ultrasonido médico se ha volcado hacia la formación de imágenes cuantitativas que puedan integrarse de manera más objetiva en sistemas de clasificación de tejidos. Uno de los parámetros cuantitativos estimables con ultrasonido es la atenuación ultrasónica. Lamentablemente, los algoritmos estimadores de atenuación sufren típicamente de una varianza elevada. La precisión puede mejorarse al analizar regiones de interés más grandes, pero ello resulta en pérdida de resolución espacial. El objetivo de esta investigación es la aplicación de promediado angular completo para extender el compromiso entre resolución espacial y precisión en la formación de imágenes cuantitativas de atenuación ultrasónica. Este estudio tiene implicancias directas en el diagnóstico de cáncer de mama, para el cual el promediado angular completo es experimentalmente aplicable. Este proyecto será desarrollado en colaboración con la Universidad de Illinois en Urbana-Champaign (UIUC) (Champaign, IL, EE.UU.).\n\nAtenuación ultrasónica; Promediado angular; Ultrasonido cuantitativo; Procesamiento de señales\n\nEngineering and technology", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "212"}, {"title": "CARACTERIZACIÓN CUANTITATIVA ULTRASÓNICA EN PRESENCIA DE ABERRACIÓN", "year": "2013", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Ingeniería", "executing_section": "Electricidad y Electrónica", "funding_type": "INTERNO", "research_lines": [], "text": "El sobrepeso y obesidad son condiciones con tasas de incidencia elevadas y en aumento tanto en Latinoamérica como en Perú. Una enfermedad asociada a estas condiciones es la enfermedad del hígado graso no alcohólico (NAFLD por sus siglas en inglés), la cual consiste en la degeneración de la estructura hepática como consecuencia del depósito de grasas sin la presencia de consumo excesivo de alcohol. NAFLD puede desencadenar en condiciones mortales como cirrosis y carcinoma hepatocelular, y por lo tanto su detección y diagnóstico es un problema clínico altamente relevante. Las técnicas existentes de diagnóstico de esta enfermedad (i.e., biopsia, evaluaciones de laboratorio y radiología) sufren de limitaciones y por tanto el desarrollo de herramientas de diagnóstico alternativas tiene un potencial impacto clínico. Una herramienta con potencial para el diagnóstico de NAFLD es el ultrasonido cuantitativo (QUS por sus siglas en inglés). QUS agrupa un conjunto de técnicas diseñadas para estimar parámetros intrínsecos de tejidos utilizando ondas ultrasónicas. Lamentablemente, los métodos QUS suelen estar basados en modelos simples de propagación que no consideran efectos como la aberración, i.e., la distorsión del frente ultrasónico al propagarse en medios heterogéneos. Por lo tanto, el diagnóstico de NAFLD usando QUS se ve comprometido en poblaciones de alto riesgo como pacientes obesos debido a la aberración causada por la abundancia de tejido graso abdominal. Con la meta final de extender la aplicabilidad de QUS al manejo clínico de NAFLD, el presente estudio tiene como objetivos principales: (1) analizar la sensibilidad de diferentes parámetros QUS (i.e., coeficientes de retro-dispersión, coeficiente de atenuación, y módulos de corte y viscosidad) a la aberración, y (2) usar técnicas de corrección de aberración para mejorar el desempeño de QUS en presencia de caminos de propagación heterogéneos.\n\nUltrasonido cuantitativo; Aberración; Caracterización de tejidos; Procesamiento de señales\n\nEngineering and technology", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "451"}, {"title": "BTC ENSAMBLE: IMPLEMENTACIÓN DE LINEAMIENTOS PARA LA CONSTRUCCIÓN DE EDIFICACIONES CON BLOQUES ENSAMBLABLES DE TIERRA COMPRIMIDA QUE SIRVAN COMO UNA SOLUCIÓN DE CONSTRUCCIÓN ECONÓMICA Y SEGURA PARA LAS VIVIENDAS LOCALIZADAS EN REGIONES DE ALTA SISMICIDAD", "year": "2019", "project_type": "aplicada", "knowledge_area": "Ingeniería y Tecnología", "executing_unit": "Departamento de Ingeniería", "executing_section": "Civil", "funding_type": "EXTERNO", "research_lines": ["Polímeros naturales y sintéticos", "Tecnología y construcción"], "text": "El proyecto tiene como objetivo general desarrollar una solución para la vivienda ecoamigable localizada en regiones de alta sismicidad (aplicable no solo al Perú sino a Latinoamérica, oeste de EEUU y varias regiones europeas) la cual involucre el uso de materiales tradicionales y procesos industrializables que, además de asegurar confort y seguridad del producto final, permitan construcciones rápidas y un control de calidad adecuado de los procesos constructivos. En este contexto, se propone el uso de bloques de tierra comprimida que serán implementados en un sistema de albañilería de junta seca y encastre entre unidades (sistema denominado como ensamblable) y para el cual se diseñará una medida de refuerzo superficial que asegure un comportamiento adecuado en sismos severos. El proyecto considera un estudio termo-higrométrico a nivel del material e indicadores que cuantifiquen las propiedades térmicas de la solución constructiva que se propone. Además del evidente impacto social y económico que la solución implicaría como sistema constructivo, el impacto científico también es elevado porque se propone desarrollo a nivel del material y validaciones a escala natural con ensayos de corte cíclico y modelamiento numérico que permitiría una formalización de este sistema constructivo incluso a nivel normativo.\n\nConstrucción con tierra; Bloques de tierra comprimida; Vivienda sismorresistente; Construcción económica\n\nEngineering and technology", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "889"}, {"title": "EL PASADO EN PELIGRO: FACTORES GEOLÓGICOS, CLIMÁTICOS Y CULTURALES QUE AFECTAN LA CONSERVACIÓN DEL PATRIMONIO ARQUEOLÓGICO EN LA COSTA DEL PERÚ", "year": "2019", "project_type": "Aplicada", "knowledge_area": "Humanidades", "executing_unit": "Departamento de Humanidades", "executing_section": "Arqueología", "funding_type": "EXTERNO", "research_lines": ["Arqueología en la costa central del Perú. Valles de Lima y Ancash", "Patrimonio arquitectónico y urbanístico"], "text": "Proyecto de investigación multidisciplinario que combina, arqueología, geoarqueología y geología, que combina la participación de la PUCP, la Universidad Nacional de Trujilo y el Climate Change Institute de la Universidad de Maine. El patrimonio arqueológico tiene un gran valor científico, histórico, cultural y de desarrollo social y económico contemporáneo. Por ejemplo, el turismo arqueológico representa el mayor porcentaje de turismo que existe en nuestro país, lo cual beneficia de manera directa e indirecta a diversos sectores de nuestra población. Sin embargo, nuestro patrimonio arqueológico se encuentra en permanente peligro de desaparición, pues el territorio peruano es un espacio altamente inestable y cambiante. Particularmente, el patrimonio arqueológico de la costa, que alberga algunos de los sitios arqueológicos más importantes de nuestro país, se encuentra bajo constante peligro de destrucción por efecto de tres factores que, combinados, están causando la rápida desaparición de decenas de sitios arqueológicos, en muchos casos con el total desconocimiento de las autoridades respectivas. Estos tres factores de riesgo son de origen climático (El Niño), geológico (movimientos tectónicos) y culturales (invasiones, derrumbes, actividades agrícolas y mineras, etc.). Nuestro proyecto plantea un estudio centrado en la identificación de los principales factores de riesgo para la conservación del patrimonio arqueológico costero, basado en los casos de dos valles altamente vulnerables como son los valles de Chao y Santa. Se busca así, elaborar una propuesta metodológica que permita identificar los factores de riesgo, su impacto y proyección a futuro y que sea aplicable a las realidades de otras regiones costeras.\n\nConservación arqueológica; Riesgos geológicos; Cambio climático; Patrimonio costero\n\nHumanities", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "881"}, {"title": "PROGRAMA ARQUEOLÓGICO SAN JOSÉ DE MORO, VALLE DEL JEQUETEPEQUE TEMPORADA 2010", "year": "2010", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Humanidades", "executing_section": "Arqueología", "funding_type": "INTERNO", "research_lines": [], "text": "La temporada 2010 es para el PASJM un año lleno de expectativas y nuevos planteamientos, los cuales serán esclarecidos a la luz no solo de nuestras excavaciones en San José de Moro sino también a partir de nuestra intervención directa, por vez primera, en importantes sitios contemporáneos en el valle de Jequetepeque. En San José de Moro planeamos continuar los trabajos en los dos sectores ya intervenidos: la zona sur (área 35, Figura 1) y la zona oeste (área 42, 44, 45 y 46, Figura 2). En la primera, los trabajos se concentrarán en la excavación de los estratos más profundos, los mismos que pertenecen al periodo de tiempo comprendido entre los 450 y 600 años después de Cristo. Estos estratos, pertenecientes al periodo denominado Mochica Medio (ver Cuadro Cronológico), se caracterizan por una serie de pisos y estructuras hallados en asociación directa a zonas de procesamiento, combustión y consumo de bienes alimenticios. Estas evidencias, se relacionan a las actividades de ritos y ceremonias de carácter fúnebre celebradas en el sitio, por lo que la excavación de este tipo de contextos será la característica más importante. De la misma manera, la excavación de un importante agrupamiento de tumbas de tipo bota (Figura 3) en la zona central de la unidad nos brindará importantes datos para el entendimiento de las prácticas funerarias y costumbres culturales durante este periodo. En contraparte, las excavaciones en la zona oeste estarán orientadas a la búsqueda de un nuevo agrupamiento de tumbas de cámaras del periodo Mochica (Figura 4), las cuales se asocian a una interesante trama arquitectónica de recintos y estructuras de carácter público y ceremonial. Con la finalidad de hallar este tipo de contextos se planeará abrir dos nuevas unidades de excavación ubicadas de manera contigua al área 46. Asimismo, continuaremos la excavación de las antiguas unidades de forma integrada y conjunta, con la finalidad de tener un panorama sincrónico u horizontal de la ocupació\n\nSan José de Moro; Valle de Jequetepeque; Arqueología moche; Temporada 2010\n\nHumanities", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "27"}, {"title": "MUJERES DE LA INDEPENDENCIA EN LA MEMORIA: MARÍA PARADO BELLIDO, MANUELA SÁENZ Y DOMINGA GUTIÉRREZ", "year": "2019", "project_type": "básica y aplicada", "knowledge_area": "Humanidades", "executing_unit": "Departamento de Humanidades", "executing_section": "Lingüística y Literatura", "funding_type": "INTERNO", "research_lines": ["Cultura, imaginarios y lenguajes", "Estado, sociedad, economía y política en el Perú y América Latina (siglos XVI-XXI)", "Género"], "text": "Nuestro proyecto pretende interrumpir la continuidad que ciertas epistemes han encontrado en la memoria nacional, construida y sostenida desde el siglo XIX con narraciones y visiones masculinas acerca de lo político, de lo heroico y precisamente de lo nacional, y generando un relato histórico incierto acerca de la ausencia de las mujeres en los procesos de independencia y de emancipación. En el marco de las reflexiones a las que invita el contexto de las celebraciones del bicentenario, este proyecto se centra en las vidas, actividades y vivencias de María Parado de Bellido, Manuela Sáenz, y Dominga Gutiérrez para examinar la relación entre historia y memoria. La propuesta es interdisciplinaria en tanto que abordamos la investigación desde la historia y desde la literatura. Conceptual y teóricamente ahonda en la relación entre memoria e historia y hace uso de categorías propuestas desde los feminismos acerca de lo político. Metodológicamente, además, amplía las formas de abordar y analizar las fuentes históricas para pensar la historia de las mujeres.\n\nMujeres en la Independencia; Memoria histórica; Historia de género; Heroínas latinoamericanas\n\nHumanities", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "870"}, {"title": "'DUELO EN LA CIUDAD DE PLATA'. NOVELA HISTÓRICA PARA ESCOLARES", "year": "2012", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Humanidades", "executing_section": "Lingüística y Literatura", "funding_type": "INTERNO", "research_lines": [], "text": "Novela histórica sobre Lima en el siglo XVII, y la historia de Juan Tasayco, un muchacho de Lurín que se ve amenazado con muchos peligros.\n\nNovela histórica; Literatura escolar; Historia colonial; Educación\n\nHumanities", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "337"}, {"title": "ENSEÑANZA DE LA HISTORIA RECIENTE EN LA EDUCACIÓN SECUNDARIA: DILEMAS MORALES, CONCEPCIONES Y PRÁCTICAS PEDAGÓGICAS DE LOS PROFESORES AL ENSEÑAR HISTORIA RECIENTE", "year": "2013", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Psicología", "executing_section": "Psicología", "funding_type": "INTERNO", "research_lines": [], "text": "Los problemas sociales solo pueden entenderse a cabalidad si se enfrentan en un sentido histórico. De esta manera, si queremos que los niños y jóvenes entiendan su sociedad y funcionen en ella -ahora y cuando adultos- como ciudadanos activos, la historia resulta ser una materia fundamental que los ayuda a construir identidad, a descentrarse de su particular punto de vista, a coordinar perspectivas y ver el mundo desde el punto de vista de los demás, a construir estructuras de causalidad complejas, a entender procesos dinámicos, a hacer juicios críticos sobre el pasado y el presente y a proyectarse al futuro comprendiendo su rol en él. Lamentablemente, en la enseñanza de la historia en la educación básica han predominado los métodos memorísticos y descriptivos que no han permitido lo anterior y que solo han conseguido que los estudiantes no se formen como ciudadanos comprometidos con los procesos sociales de su país y rechacen y desvaloricen la historia como disciplina. Sin embargo, los planteamientos psicopedagógicos más recientes para enseñar historia plantean que esta debe desarrollar el razonamiento histórico en los estudiantes desde una perspectiva crítica, lo que implica exponerlos a discusiones activas, fuentes contradictorias, argumentos con distintos niveles de validez, explicacionesdel contexto histórico de un evento, conceptos históricos, perspectivas éticas para analizar acontecimientos, etc. Se sabe, por diversas investigaciones, que la enseñanza de la historia requiere competencias especiales que distan mucho de las reales capacidades de los docentes, y que, además, ciertos temas, como los de historia reciente, movilizan en ellos procesos cognitivos y afectivos particulares. En esta línea, nos planteamos investigar las concepciones pedagógicas que los docentes de secundaria tienen sobre la enseñanza de la historia, sus prácticas efectivas en aula, así como los dilemas morales por los que atraviesan al abordar temas de historia reciente.\n\nHistoria reciente; Educación secundaria; Dilemas morales; Prácticas pedagógicas\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "412"}, {"title": "EXPERIENCIA PILOTO DE VALIDACIÓN DEL VIDEOFEEDBACK - INTERVENTION TO PROMOTE POSITIVE PARENTING AND SENSITIVE DISCIPLINE EN UN GRUPO DE MADRES PRIVADAS DE SU LIBERTAD", "year": "2014", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Psicología", "executing_section": "Psicología", "funding_type": "INTERNO", "research_lines": ["Psicología de la personalidad"], "text": "La situación en la que las madres privadas de su libertad hacen frente a la maternidad constituye un riesgo para el desarrollo emocional del niño y de ella misma. Desde la teoría del apego se ha desarrollado un programa de intervención denominado Videofeedback - Intervention to Promote Positive Parenting and Sensitive Discipline (VIPP SD) que ha demostrado tener eficacia para incrementar la capacidad sensitiva de las madres aún en condiciones de riesgo. Por estas razones, esta investigación tiene como objetivos centrales evaluar la eficacia de este programa en un grupo de madres privadas de su libertad y a partir de ello, incrementar el comportamiento sensitivo de las madres privadas participantes de la intervención. Participarán el total de las madres del establecimiento penitenciario elegido (aproximadamente 40). De ellas, la mitad será designada aleatoriamente al grupo de estudio el cual recibirá la intervención VIPP SD al inicio del estudio, la otra mitad será el grupo control que recibirá una intervención alternativa enfocada en el desarrollo del niño. Ambos grupos serán evaluados al inicio y al final de la intervención recibida. Una vez concluida la intervención en el grupo de estudio, el grupo control participará del VIPP SD.\n\nCrianza positiva; Videorretroalimentación; Disciplina sensible; Madres privadas de libertad\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "500"}, {"title": "EL BINGE DRINKING Y EL CONSUMO DE MARIHUANA EN UNIVERSITARIOS: SU COMPRENSIÓN DESDE LA TEORÍA DE LA ACCIÓN PLANIFICADA", "year": "2015", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Sociales", "executing_unit": "Departamento de Psicología", "executing_section": "Psicología", "funding_type": "INTERNO", "research_lines": ["Salud y bienestar"], "text": "En el Perú, el alcohol es la droga lícita de mayor consumo, mientras que la marihuana es la droga ilícita de mayor consumo. En los estudiantes universitarios existe una prevalencia anual de consumo de alcohol de 71.7% y el 25.5% de estos estudiantes califican como consumidores de riesgo o realizan un uso perjudicial (PRADICAN, 2013). La marihuana tiene una prevalencia por año en universitarios de 4.3% y el 28.8% de consumidores realizan un uso perjudicial de ella (PRADICAN, 2013), además la prevalencia de vida de su consumo aumenta drásticamente entre las edades de 19 a 24 años (CEDRO, 2013). Es necesario realizar mayor investigación en factores relacionados que puedan predecir estas conductas debido a que la mayor cantidad de investigación ha sido epidemiológica o ha tenido como objetivo hallar relaciones entre ciertos factores y el consumo (CEDRO 2004, 2013; PRADICAN, 2013; Espinoza, 2011; Rojas, 2012), mas no predecir el mismo. En ese sentido la Teoría de la Acción Planeada une diversos factores: la actitud hacia el comportamiento, la norma subjetiva y el control conductual para predecir el comportamiento, y ha demostrado explicar y predecir satisfactoriamente la conducta y la intención de realizar binge drinking en universitarios (Cooke, Sniehotta y Schüz, 2007; Johnston y White, 2003; Norman y Conner, 2006; Norman, 2011); y el consumo de marihuana en adultos jóvenes (Conner y McMillan, 1999; McMillan y Connor, 2003; Morrison, Golder, Keller y Gillmore, 2002; O¿Callaghan y Joyce, 2006). El propósito de este estudio será examinar la capacidad de la Teoría de la Acción Planificada para predecir el binge drinking y el consumo de marihuana en estudiantes universitarios. Para este propósito se construirán y validarán dos instrumentos psicológicos para medir los aspectos de la Teoría de la Acción Planificada en las conductas de binge drinking y consumo de marihuana.\n\nConsumo de alcohol; Marihuana; Estudiantes universitarios; Teoría de la acción planificada\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "616"}, {"title": "FORMACIÓN DE ACOMPAÑANTES PEDAGÓGICOS INDÍGENAS PARA ESCUELAS EIB DE LA REGIÓN UCAYALI: UNA INVESTIGACIÓN ACCIÓN", "year": "2015", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Sociales", "executing_unit": "Departamento de Psicología", "executing_section": "Psicología", "funding_type": "INTERNO", "research_lines": ["Salud y bienestar"], "text": "El asesoramiento psicopedagógico se define como un conjunto de procesos destinados a apoyar a docentes de diferentes escenarios educativos en la mejora de sus prácticas de enseñanza. En este proyecto, se pretende hacer un diagnóstico de necesidades de acompañamiento psicopédagógico de un grupo de docentes indígenas de la región Ucayali, que vienen trabajando acompañando a profesores de aula en comunidades Asháninka y Shipibo-Konibo de la región. En base a este diagnóstico se implementará un programa ad hoc para reforzar las capacidades de este grupo de acompañantes, el que será finalmente evaluado para comprobar su eficacia. Se trata pues de un proyecto de investigación-acción orientado a generar conocimiento respecto al acompañamiento psicopedagógico de profesores indígenas que trabajan en escuelas EiB (Educación Intercultural bilingüe).\n\nEducación intercultural bilingüe; Acompañamiento pedagógico; Docentes indígenas; Ucayali\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "600"}, {"title": "CONSTRUYENDO UNA UNIVERSIDAD INCLUSIVA: EXPLORANDO LOS MODOS DE ORGANIZACIÓN DE LAS UNIVERSIDADES PERUANAS PARA ATENDER A LOS BECARIOS DEL PROGRAMA BECA 18 DE LAS MODALIDADES ESPECIALES CNA Y EIB", "year": "2017", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Sociales", "executing_unit": "Departamento de Ciencias Sociales", "executing_section": "Antropología", "funding_type": "INTERNO", "research_lines": ["Desarrollo y responsabilidad social", "Gestión educativa"], "text": "En los últimos 5 años se ha desarrollado en el Perú un masivo programa de becas para estudios superiores (Beca 18) dirigido a estudiantes en situación de pobreza y extrema pobreza. Posteriormente se incluyeron las modalidades especiales Comunidades Nativas de la Amazonía (CNA) y Educación Intercultural Bilingüe (EIB) para jóvenes indígenas. Los estudios realizados hasta el momento se han enfocado en el funcionamiento del programa en sus diversas fases y en las experiencias de los becarios, explorando la experiencia universitaria sólo desde el punto de vista de la adaptación individual del becario. Tanto desde el programa como desde los estudios revisados, la educación superior aparecería entonces como un espacio neutro de trasmisión de conocimientos al que la población antes excluida podría, finalmente, tener acceso. Sin embargo, la investigación social ha demostrado que la educación superior es un espacio complejo donde circulan y se valoran determinados conocimientos y comportamientos (y no otros). Ignorar este aspecto de la experiencia universitaria pone todo el peso de la trayectoria educativa en el o la estudiante, dejando de lado factores institucionales y sociales. Este proyecto se propone abordar esta dimensión menos estudiada. Así, se pregunta qué está sucediendo en el espacio universitario peruano hoy, y cómo responde la universidad a la presencia de los becarios de poblaciones amazónicas e indígenas, entendiendo que estas respuestas son diversas. Exploraremos qué arreglos organizativos surgen para atender a esta población, si varían entre universidades y de qué manera estos arreglos incluyen o excluyen a los estudiantes y cómo perciben esta nueva situación los diversos actores educativos (becarios, autoridades, docentes, tutores y otros estudiantes). El estudio, de carácter cualitativo, se realizará en las tres universidades con mayor alumnado de las modalidades especiales CNA y EIB.\n\nEducación superior inclusiva; Beca 18; Estudiantes indígenas; Gestión universitaria\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "813"}, {"title": "¿DE QUÉ GESTIÓN EDUCATIVA LOCAL HABLAMOS?. EL PAPEL DE LOS GOBIERNOS LOCALES EN LA DESCENTRALIZACIÓN DE LA EDUCACIÓN. ESTUDIO DE 4 CASOS DE MUNICIPIOS EN PIURA", "year": "2010", "project_type": "aplicada", "knowledge_area": "", "executing_unit": "Departamento de Ciencias Sociales", "executing_section": "Sociología", "funding_type": "INTERNO", "research_lines": [], "text": "Este documento corresponde a los resultados de la investigación del concurso del semestre sabático de la PUCP correspondiente al año 2010, y estudia la descentralización educativa en Piura, así como el rol de la gestión municipal en la educación, específicamente en Paita, Las Lomas y Morropón.\n\nGestión educativa local; Descentralización; Gobiernos municipales; Piura\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "108"}, {"title": "DIÁLOGO DE CONOCIMIENTOS SOBRE JUSTICIA Y BIENESTAR EMOCIONAL CON ESTUDIANTES Y DOCENTES UNIVERSITARIOS ANDINOS", "year": "2014", "project_type": "Interdisciplinario", "knowledge_area": "Ciencias Sociales", "executing_unit": "Departamento de Ciencias Sociales", "executing_section": "Antropología", "funding_type": "INTERNO", "research_lines": ["Comunicación intercultural"], "text": "Las universidades públicas del país, particularmente las regionales, cuentan con muchos estudiantes y docentes de origen rural andino cercanos a antiguos conocimientos y prácticas culturales, pero generalmente no sacan provecho de ese legado cultural. Ante esta situación, el proyecto busca investigar acerca de las dificultades y posibilidades para articular conocimientos y prácticas de la cultura andina a la formación universitaria, en el campo del establecimiento de la justicia y el bienestar, como convivencia social armoniosa y equilibro emocional. Las disciplinas concernidas son la psicología (bienestar y salud emocional), el derecho, las ciencias sociales y la filosofía (epistemología). Se parte de una experiencia previa de RIDEI de impulso al diálogo de conocimientos en la universidad. Se recoge, además, por un lado, una larga experiencia de estudio de las formas tradicionales de justicia y de búsqueda de articular el derecho oficial con esas formas tradicionales y, por otro lado, los trabajos realizados en la perspectiva de acercarse a los conflictos desde una psicología comunitaria inspirada en principios interculturales, en especial desde prácticas y reflexiones surgidas a partir del conflicto armado interno. A diferencia del enfoque habitual, una noción integral de justicia está fuertemente relacionada con el bienestar y la salud emocional, noción que en la cultura andina corresponde al allin kawsay que abarca lo individual y lo colectivo como dos caras de la misma realidad. Se buscará conocer las dificultades y posibilidades para integrar dentro de la formación universitaria conocimientos y prácticas de la cultura andina en el campo del establecimiento de la justicia y el bienestar entendido como convivencia social armoniosa y equilibro emocional. Se trabajará en talleres con docentes y estudiantes de la Universidad Nacional de San Cristóbal de Huamanga vinculados a las ciencias de la salud, al derecho y a la antropología.\n\nJusticia Intercultural; Bienestar Emocional; Educación Superior; Saberes Andinos\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "533"}, {"title": "FUERA DE JUEGO: LAS BASES INSTITUCIONALES DE LA CRISIS DEL FUTBOL PERUANO", "year": "2015", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Sociales", "executing_unit": "Departamento de Ciencias Sociales", "executing_section": "Sociología", "funding_type": "INTERNO", "research_lines": ["Política, gobierno e instituciones"], "text": "La investigación parte de la premisa que la crisis sistémica que sufre el futbol peruano es un objeto legitimo de análisis académico. En efecto, tanto la ausencia reiterada de resultados deportivos, como la bancarrota económica de los clubes, y la conducta delictiva de algunas dirigencias plantean que las bases de esta crisis se encuentran más allá del campo de juego. Proponemos, por ello, indagar en la forma de gestión de este deporte y en las organizaciones y actores que participan de ella. El objetivo es identificar las lógicas y los marcos institucionales que intervienen en el gobierno del fútbol peruano, desde las prácticas de los principales actores involucrados. Como hipótesis, planteamos que la crisis del fútbol peruano es resultado de la ausencia de una institucionalidad unificada en tanto no existe coherencia en el accionar entre los tres niveles de gobierno (FIFA, Federación Peruana de Fútbol y los clubes de fútbol profesional), pero también de las desavenencias, tensiones y conflictos entre ellas expresadas en distintas coyunturas críticas. Al interior de cada nivel de gobierno, no obstante, subsisten lógicas patrimonialistas enraizadas históricamente junto con lógicas modernas y de negocio promovidas en las últimas décadas por el mercado global y el Estado peruano creando, de esta manera, espacios de disputa entre ambas lógicas. Precisamente la crisis ingresa a un momento crítico por la intervención del Estado (SUNAT e INDECOPI) en favor de la lógica de negocio y mercado, y en contra de la lógica patrimonialista, informal e incluso delictiva.\n\nFútbol peruano; Instituciones deportivas; Gobernanza; Crisis organizacional\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "598"}, {"title": "MODELS OF INFLUENCE: EXPLORING THEPOTENTIAL AND IMPACT OF INDIGENOUS FEMALE COMMUNITY PARTICIPATION ANDLEADERSHIP IN PERU", "year": "2021", "project_type": "básica y aplicada", "knowledge_area": "Desarrollo Tecnológico", "executing_unit": "CISEPA - Centro de Investigación Social, Económica Política y Antropológica", "executing_section": "", "funding_type": "EXTERNO", "research_lines": ["Derechos de la persona y discriminación"], "text": "Las mujeres juegan un papel fundamental en la seguridad alimentaria, la preservación de la biodiversidad y los conocimientos ancestrales, y la gestión y defensa de las tierras y aguas amazónicas, sin embargo estos aportes muchas veces no son reconocidos. (Marcelo, ONAMIAP, 2018) Este proyecto participativo resaltará la importancia de que las mujeres indígenas y rurales participen activamente en sus comunidades para ejercer el control sobre los recursos. Trabajando junto a un grupo de mujeres indígenas en la Amazonía peruana, este proyecto pregunta por qué las mujeres aún están excluidas de la toma de decisiones comunitarias, revelando los determinantes culturales y sociales que las bloquean de los roles de liderazgo e influencia y buscan nuevas formas de empoderamiento. Analizamos el trabajo que realizan las mujeres como miembros de la comunidad y líderes, sus ambiciones, redes y esferas de influencia en el contexto de conflicto, riesgo y desastre. Las actividades codiseñadas darán como resultado resultados de investigación y recomendaciones de políticas que se presentarán a las partes interesadas locales/regionales/nacionales, incluidos representantes gubernamentales, civiles y corporativos.\n\nLiderazgo de mujeres indígenas; Participación comunitaria; Empoderamiento; Perú\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "913"}, {"title": "UNA DISTANCIA SOCIAL EQUÍVOCA: CERCANÍA Y CUIDADO FRENTE AL COVID-19 EN LOS PUEBLOS INDÍGENAS DEL BAJO MARAÑÓN", "year": "2020", "project_type": "básica y aplicada", "knowledge_area": "Antropología", "executing_unit": "CISEPA - Centro de Investigación Social, Económica Política y Antropológica", "executing_section": "", "funding_type": "EXTERNO", "research_lines": ["Interculturalidad", "Procesos y actores sociales", "Pueblos indígenas e interculturalidad"], "text": "Loreto es hoy en día una de las regiones con más casos de contagiados confirmados por la COVID-19 en Perú. Al 12 de agosto de este año, la región presentaba 32 248 contagios confirmados según el reporte oficial de la DIRESALoreto. A lo largo de estas semanas, se han barajado varias hipótesis sobre por qué es tan difícil que se respete el distanciamiento social en esta región. Una de estas ha sido trabajada por Alberto Chirif quién además de la pobreza, apunta a la disminución de las redes de reciprocidad familiares y de liderazgos referenciales de la población indígena ribereña que migró a la urbe. Esto ocurre porque en las comunidades nativas, las normas se cumplen por convencimiento y las responsabilidades se ejercen a través de redes familiares. En las comunidades estos vínculos territoriales, sociales y familiares hicieron que el “distanciamiento social” sea interpretado y vivido de forma distinta: cuarentenas comunales y aislamiento en el bosque. Desde una antropología del Estado, nos interesa trabajar sobre el problema del desconcierto o del equívoco que se produce cuando el mismo término o categoría es entendida de diferente manera, lo cual afecta el proceso de traducción cultural. Viveiros de Castro lo aborda en relación a las cosmologías amazónicas y Kelly lo desarrolla en el campo de las políticas interculturales en salud. Desde este enfoque trabajaremos sobre el “aislamiento social” decretado por el gobierno peruano en el marco de la Emergencia Sanitaria por la COVID-19 y puesto en práctica por las poblaciones indígenas en la Amazonía. ¿Qué sucede cuándo el Estado promulga un decreto de emergencia sanitaria enviando a los pueblos indígenas a mantener el aislamiento social? ¿Cómo ha sido entendido por varones y mujeres de pueblos indígenas que poseen nociones particulares sobre los vínculos que unen los cuerpos entre parientes y el cuidado de estos a pesar de la distancia física? ¿Cómo estas nociones indígenas diferenciadas por género interactúan con las instituciones del Estado que siguen una lógica que generaliza a la población del país? ¿Cómo se ha comprendido el concepto a partir de experiencias previas en que utilizaron el aislamiento social como una estrategia para enfrentar otras enfermedades? El aislamiento social ha sido y es una estrategia de cuidado en pueblos indígenas amazónicos. Les ha permitido enfrentar enfermedades epidémicas vinculadas al contacto desde el siglo XVI y también ha sido empleada cuando se han sentido amenazados por la explotación, por ejemplo, del caucho y en las últimas décadas, del petróleo y los recursos forestales. Este es un proyecto de investigación-acción basado en una etnografía en la que nos interesa poner en diálogo y tensión las políticas del Estado peruano sobre aislamiento y distanciamiento social, orientadas al cuidado de la población. El objetivo es comprender las formas y la organización del cuidado en las comunidades Kukama y Urarinas del Bajo Marañón, que habitan en el área petrolera de la región para así entender, histórica y etnográficamente cómo las disposiciones estatales se han llevado a cabo durante la pandemia. Las relaciones de cuidado permiten también identificar los roles diferenciados de las mujeres y los varones. Si bien las primeras asumen la alimentación, la limpieza y la cura de los cuerpos familiares, son los varones quienes promovieron protocolos de cuidado comunitario. Trabajaremos entonces sobre cuidados comunales, territoriales, espaciales, sociales y cosmológicos. La finalidad de este proyecto es generar información empírica para contribuir con el Estado en el diseño de sus políticas interculturales sobre salud y cuidados, que han suscitado malentendidos en los últimos meses a raíz de la emergencia sanitaria.\n\nPueblos indígenas; Prácticas de cuidado; COVID-19; Bajo Marañón\n\nSocial sciences; Social sciences; Social sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "906"}, {"title": "MEMORIAS EN ESTADO DE EMERGENCIA: LA EXPERIENCIA DE LA COMUNIDAD EDUCATIVA DE LA ALDEA DEL NIÑO DE MAZAMARI", "year": "2019", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Sociales", "executing_unit": "CISEPA - Centro de Investigación Social, Económica Política y Antropológica", "executing_section": "", "funding_type": "INTERNO", "research_lines": ["Democracia, Ciudadanía y Derechos Humanos", "Democracia, ciudadanía y derechos humanos", "Derechos de la persona y discriminación"], "text": "Esta investigación parte de analizar dos fenómenos que conviven en la Institución Educativa Aldea del Niño Beato Junípero Serra de Mazamari y que inciden en las experiencias educativas de jóvenes indígenas de los últimos dos años de educación secundaria y en la comunidad educativa alrededor de la escuela. Por un lado, se analiza el proceso de normalización de la violencia en el contexto del estado de emergencia en el que vive la provincia de Satipo ¿entendiendo como una prolongación del conflicto armado interno¿ y, por otro, el proceso de reflexión sobre la violencia del pasado reciente por parte de los docentes de la escuela que participaron del proyecto Construcción de la paz, memoria, jóvenes y oportunidades educativas implementado por el Instituto de Democracia y Derechos Humanos de la Pontificia Universidad Católica del Perú (IDEHPUCP) entre el 2012 y el 2015. Al culminar, se busca comprender cuáles son las negociaciones que se ponen en marcha entre los estudiantes indígenas para dar sentido a su experiencia educativa desde sus identidades locales y el sistema educativo particular implementado por su escuela dentro del contexto político en el que transcurren sus vidas. Asimismo, analizar los procesos de memoria desarrollados por los distintos actores de la comunidad educativa y las formas cómo se relacionan con el contexto local actual. Todo esto, desde una perspectiva de interculturalidad y memoria que busca comprender la experiencia sobre el pasado reciente y los derechos humanos a partir de un proyecto de intervención. Por lo tanto, la investigación se propone con un carácter cualitativo de enfoque etnográfico y exploratorio que busca brindar las primeras luces sobre el proceso de normalización de la violencia armada y estructural desde la cotidianidad de la comunidad educativa y, de esta manera, aproximarse a un proceso generado por la propia labor de la universidad y su intervención en un espacio geográfico y social particular.\n\nMemoria educativa; Emergencias sociales; Comunidad escolar; Mazamari\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "874"}, {"title": "APERTURA DE REDES MÓVILES: INNOVACIÓN Y DESARROLLO", "year": "2010", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Comunicaciones", "executing_section": "Comunicaciones", "funding_type": "INTERNO", "research_lines": [], "text": "En el contexto del uso de las TIC para la promoción del desarrollo socioeconómico de la región, se presenta la tecnología móvil como la herramienta que promete beneficios importantes. En este sentido, las aplicaciones móviles son un elemento clave para aprovechar la alta penetración de la telefonía móvil y poder llevar información y desarrollo a través de estas redes, sobre todo a la población que reside en áreas rurales remotas o para quienes el teléfono celular representa uno de los pocos o el único medio de comunicación. En el estado actual de las redes móviles, la inteligencia se encuentra en los terminales móviles, representando una oportunidad para la innovación en el desarrollo de software que da origen a las aplicaciones móviles. Sin embargo, el problema principal que encontramos es que, a pesar de los grandes avances técnicos y la gran oportunidad que representan para los procesos de desarrollo, las redes móviles siguen manteniendo características de redes cerradas especialmente en lo referido a las aplicaciones que corren sobre los dispositivos, bloqueando la posibilidad de la innovación. Es imperativo trabajar en esquemas regulatorios que favorezcan la apertura de las redes móviles considerando aquí tanto el servicio, como la conexión de dispositivos y el desarrollo de aplicaciones sobre estos dispositivos. Para Latinoamérica las recomendaciones de política son de vital importancia ya que en la actualidad la oferta de aplicaciones es aún incipiente y las industrias de desarrollo de software y aplicaciones se encuentran en nacimiento. Así, el estudio de factores que aseguren la apertura de redes móviles aportará a la definición de la situación futura de las mismas, impactando en la innovación y el desarrollo.\n\nRedes móviles abiertas; Telecomunicaciones; Innovación; Desarrollo tecnológico\n\nEngineering and technology", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "101"}, {"title": "POLÍTICAS DE INCLUSIÓN EN LA EDUCACIÓN SUPERIOR; EL CASO DE BECA18 ¿QUÉ EFECTOS TIENE LA AMPLIACIÓN DE LA ESCOLARIDAD?", "year": "2014", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Comunicaciones", "executing_section": "Comunicaciones", "funding_type": "INTERNO", "research_lines": ["Economía y política en el Perú republicano"], "text": "El estudio se propone identificar efectos del proceso de inserción en la educación superior de jóvenes beneficiarios/as del Programa Nacional BECA18-Modalidad Ordinaria. El Programa de Becas se creó en 2011, en el marco de la política de inclusión social con el propósito de mejorar la equidad en el acceso a la educación superior, actuando como un mecanismo de igualación de oportunidades. El Programa financia estudios de pregrado en universidades, y estudios técnicos en institutos, de gestión pública o privada, a jóvenes pobres egresados de instituciones educativas públicas con un buen desempeño académico. El año 2012 el primer grupo estuvo formado por cerca de 4 mil becarios provenientes de distintas regiones del país, sólo 7% provino de Lima-Callao;; menos del 30% son mujeres; y 15,5% tiene como lengua materna el quechua; 54% optó por una carrera universitaria y 46% por estudios técnicos. El enfoque del estudio asume al o la becaria no como un individuo, sino como parte integrante de un núcleo familiar que es también una unidad económico productiva localizada en contextos sociales de pobreza y pobreza extrema. Es en ese núcleo y en ese contexto social inmediato que debe ser comprendida la decisión de incrementar los años de escolaridad prosiguiendo estudios superiores. El estudio busca identificar los efectos que produce en los y las jóvenes becarios y becarias y en sus familias, la decisión de iniciar estudios superiores; poniendo el foco en los sentidos que para ellos tiene la educación superior más allá de la inserción en el mercado laboral o la futura empleabilidad. El propósito es explorar otras valoraciones sobre educación y lo que las personas consiguen mediante su acceso, diferentes a las que usualmente son medidas en términos de los retornos económicos. Estas pueden referirse a una serie de situaciones logradas fruto de más años de escolaridad, tales como la postergación de la edad del matrimonio y la maternidad; el establecimiento de relaciones de pa\n\nInclusión Educativa; Educación Superior; Beca 18; Políticas Públicas\n\nSocial sciences; Social sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "479"}, {"title": "AGENTES, AGENDAS Y POLÍTICAS PARA LA CIUDADANÍA DIGITAL DE LAS NIÑAS, LOS NIÑOS, Y LAS Y LOS ADOLESCENTES", "year": "2021", "project_type": "básica", "knowledge_area": "Sociología", "executing_unit": "Departamento de Comunicaciones", "executing_section": "Comunicaciones", "funding_type": "EXTERNO", "research_lines": ["Conunicación y medios digitales"], "text": "Proyecto que a través de entrevistas y grupos de discusión con actores claves del gobierno, sociedad civil, academia y empresas, busca promover la reflexión y generar conocimiento sobre la ciudadanía digital de los NNA para influir en agendas y políticas que protejan los derechos de los NNA y favorezcan el desarrollo de las capacidades necesarias para que su uso de la internet y la tecnología tenga un efecto positivo en su bienestar.\n\nCiudadanía digital; Niñez y adolescencia; Políticas públicas; Derechos digitales\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "927"}, {"title": "TEORÍA GENERAL DEL DELITO EN UN ESTADO CONSTITUCIONAL DE DERECHO", "year": "2010", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Derecho", "executing_section": "Derecho", "funding_type": "INTERNO", "research_lines": [], "text": "1. La existencia de un sistema de resolución de conflictos eficaz, objetivo, previsible y oportuno, es una condición imprescindible para el desarrollo de la sociedad y de las personas. Así, cuanto mayor sea la eficacia del poder judicial mayor será la seguridad jurídica y mayor será también la protección que se le dispense a la libertad. Esta idea, trasladada al ámbito penal, es la que justifica el proyecto Manual de Derecho Penal-Parte General (se adjunta archivo con el esquema del Proyecto Manual de Derecho Penal-Parte General): es imprescindible que los conflictos sociales que el Derecho Penal aborda (lesiones a vida, integridad, libertad, patrimonio, derechos humanos, administración pública, etc.) sean resueltos adecuada y oportunamente. 2. La actual reforma penal y procesal penal, que se inserta dentro de la reforma de administración de justicia, es una empresa que requiere el concurso de diversas instituciones y una decidida política criminal. Pero requiere también de criterios claros de imputación de responsabilidad penal, de manera que todos los ciudadanos podamos conocer y comprender las reglas de juego que rigen la pérdida de nuestra libertad. Solo así se podrá limitar la actividad sancionadora del Estado en defensa de los derechos fundamentales de las personas. 3. El proyecto Manual de Derecho Penal-Parte General pretende desarrollar y sistematizar dichos criterios de imputación de responsabilidad penal que, si bien se encuentran en el Código Penal, no por ello resultan ser coherentes y comprensibles. Se pretende, en otras palabras, interpretar la legislación con arreglo a los principios constitucionales y ofrecer el marco teórico a partir del cual 1. Condición imprescindible para el desarrollo de las personas en sociedad es la existencia de un sistema de resolución de conflictos eficaz, previsible y oportuno. Tratándose de conflictos que revisten relevancia penal (como los atentados contra la vida, el patrimonio, la administración pública, el me\n\nTeoría del delito; Estado constitucional; Derecho penal; Garantías jurídicas\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "6"}, {"title": "EL DERECHO INTERNACIONAL DE LOS DERECHOS HUMANOS: UNA PERSPECTIVA DESDE Y PARA EL PERÚ.", "year": "2016", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Sociales", "executing_unit": "Departamento de Derecho", "executing_section": "Derecho", "funding_type": "INTERNO", "research_lines": ["Democracia, ciudadanía y derechos humanos"], "text": "La propuesta de investigación busca identificar los retos actuales del Derecho Internacional de los Derechos Humanos (DIDH) en el caso peruano. Esta investigación contará con cuatro partes. En la primera, se presentará la teoría general del Derecho Internacional de los Derechos Humanos. En ese sentido, se analizará su estructura, funcionamiento, así como sus principales instituciones. De esta manera, se planteará el marco teórico del que partirá el resto de la investigación. La segunda parte de la investigación versará sobre los distintos sistemas internacionales de protección de derechos humanos. A saber: el Sistema Universal y los sistemas regionales, es decir, el Sistema Interamericano de Protección de Derechos Humanos, el Sistema Europeo y el Sistema Africano. Se realizará un análisis más detallado en lo que respecta al Sistema Interamericano debido a la pertenencia del Perú al mismo. Se tomará en consideración, también, el hecho que el Perú es el país con mayor número de casos ante la Corte Interamericana de Derechos Humanos. En la tercera parte, se desarrollará la relación entre el DIDH y el ordenamiento jurídico peruano. En ese sentido, se analizará el nivel de obligatoriedad de las distintas normas del DIDH en el ordenamiento nacional, en base a las obligaciones concretas que tiene el Estado peruano bajo esta rama del Derecho Internacional. Finalmente, a la luz de lo establecido en las partes precedentes de la investigación, se identificarán cuáles son los retos actuales del Derecho Internacional de los Derechos Humanos en el caso peruano y, en ese sentido, se desarrollarán herramientas teórico-prácticas del DIDH que puedan ayudar a los operadores de justicia a enfrentar esos retos en consonancia con los estándares del Derecho Internacional.\n\nDerechos humanos; Derecho internacional; Sistema peruano; Protección jurídica\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "732"}, {"title": "CUESTIONAMIENTOS A LA APLICACIÓN DEL PRINCIPIO DE LAICIDAD EN EL ESTADO PERUANO", "year": "2013", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Derecho", "executing_section": "Derecho", "funding_type": "INTERNO", "research_lines": [], "text": "La laicidad es uno de los principios que rige al Estado democrático de Derecho y guarda relación con los principios liberales de tolerancia, pluralismo y neutralidad estatal (frente a concepciones morales o religiosas particulares). La laicidad es garantía, también, del respeto de ciertos derechos fundamentales sobre los que se construye la propia idea de Estado de Derecho (en especial, los derechos de libertad de conciencia e igualdad y no discriminación). La investigación que aquí se propone, pretende identificar y cuestionar el tratamiento conferido por algunos órganos estatales (por ejemplo, por parte de la Administración Pública, el Poder Legislativo o el Tribunal Constitucional) a ciertas manifestaciones en las que se pone en entredicho el principio de laicidad del Estado, principalmente referido a la relación entre el Estado peruano y la Iglesia Católica; respuestas que, por su trascendencia, representarían la interpretación oficial del Estado peruano sobre el principio de laicidad, en áreas como la educación, la cultura, entre otras.\n\nLaicidad; Estado peruano; Libertad religiosa; Derecho constitucional\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "441"}, {"title": "CAMBIO CLIMÁTICO Y POLÍTICAS DE GESTIÓN AMBIENTAL EN LA CADENA EXPORTADORA DE LA QUINUA EN EL PERÚ", "year": "2016", "project_type": "básica y aplicada", "knowledge_area": "Ciencias Sociales", "executing_unit": "Departamento de Economía", "executing_section": "Economía", "funding_type": "INTERNO", "research_lines": ["Desarrollo económico, innovación, cambio tecnológico y crecimiento"], "text": "El Perú es uno de los países más vulnerables al cambio climático. Al mismo tiempo, es un país megadiverso y en el notable crecimiento previo a esta crisis, hubo un boom exportador agroindustrial y de bionegocios. Es fundamental encontrar los mecanismos que permitan un crecimiento sostenible, en base a la diversificación de la explotación de nuestros recursos naturales. La investigación busca identificar los efectos del cambio climático sobre estas exportaciones, particularmente el caso de la quinua. Este es un producto que al igual que los otros granos andinos, tiene relativamente mayor resistencia al cambio climático y es un eje central de crecimiento verde inclusivo para un país como el nuestro. Paradójicamente, las zonas y regionales donde está la mayor diversidad, son también las de mayor pobreza. Hay experiencias exitosas de inserción en el mercado internacional de pequeños productores y agricultores, que han permitido mejorar sustancialmente su nivel de vida. Nos parece central por ello, conocer los factores y efectos del cambio climático que amenazan el desarrollo de esta actividad. Esto se viabilizará con un trabajo de campo in situ, que continúe estudios que hemos realizado. Se busca evaluar la percepción de los actores sobre este impacto, en las distintas fases de la cadena productiva, buscando identificar con los actores públicos y privados, nacionales y regionales, algunas propuestas para enfrentarlo.\n\nQuinua; Cambio climático; Gestión ambiental; Cadena exportadora\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "759"}, {"title": "¿UNA GRAN TRANSFORMACIÓN? ECONOMÍA EXTRACTIVA Y DESARROLLO INSTITUCIONAL EN LA AMAZONÍA PERUANA", "year": "2013", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Economía", "executing_section": "Economía", "funding_type": "INTERNO", "research_lines": [], "text": "Esta investigación busca aportar al conocimiento sobre la gobernanza de la economía y el ambiente en la Amazonía. Conceptualizada por el análisis económico como una fuente de bienes comunes y servicios ambientales de importancia crítica para el bienestar del planeta, la Amazonía ha sido poco estudiada por economistas, historiadores económicos y economistas políticos. Nuestra hipótesis general es que la 'Gran Transformación' (referencia a Polanyi 1944) de la Amazonía es un proceso histórico de mucha complejidad, altamente mediado por mecanismos institucionales. Estudiaremos la emergencia de tres instituciones: las áreas naturales protegidas, el territorio indígena comunal y la consulta previa. Tres redes difusas de 'comunidades epistémicas' de la sociedad (problematizadas por el nuevo institucionalismo sociológico de DiMaggio y Powell 1983 y Scott 2008), conectadas pero autónomas, son cl
