aves para entender este desarrollo institucional: los ingenieros forestales y científicos de la naturaleza, los antropólogos, y los abogados. El desarrollo institucional de la Amazonía no se agota, sin embargo, en el proceso macro del activismo de élites. En la base, se adapta y recrea, se retroalimenta y transforma lo que se establece en la cúspide. Como los legados institucionales y la acción colectiva local no suelen ser homogéneos, cómo subrayan el institucionalismo histórico y el nuevo institucionalismo económico (e.g. Pierson 2004 y Ostrom 2005, respectivamente), las áreas naturales protegidas, el territorio indígena comunal y la consulta previa generan diversidad institucional. La metodología está compuesta por tres elementos: (i) trabajo de archivo, (ii) análisis histórico institucional, y (iii) análisis comparado de casos (Tambopata y Santiago Comaina).\n\nEconomía extractiva; Desarrollo institucional; Amazonía; Gobernanza\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "460"}, {"title": "LA DESIGUALDAD EN EL PERÚ: HERENCIA COLONIAL, ECONÓMICA Y POLÍTICA", "year": "2011", "project_type": "Interdisciplinario", "knowledge_area": "", "executing_unit": "Departamento de Economía", "executing_section": "Economía", "funding_type": "INTERNO", "research_lines": [], "text": "América Latina es la región del mundo que presenta la mayor desigualdad en la distribución de los ingresos. En el Perú, el valor de largo plazo de la desigualdad se ha mantenido en torno a 0.60, medido por el coeficiente de Gini, lo que lo convierte en uno de los más altos en el mundo. ¿Por qué la distribución del ingreso es tan desigual en el Perú? ¿Por qué la persistencia de largo plazo de esta desigualdad? Estas son las preguntas fundamentales que esta investigación pretende responder. Nuestra hipótesis general es que el nivel y la persistencia de la desigualdad en el largo periodo comprendido entre 1950 y 2009 se debe a factores históricos (el punto de partida o la llamada 'herencia colonial'), económicos (el estilo de crecimiento económico, la exclusión de los mercados de crédito y trabajo de amplios sectores de la población, y el carácter regresivo de la política fiscal) y políticos (el grado de democratización del estado, y el nivel de organización y de centralización sindical, social y política de las clases populares). Como producto de la investigación publicaremos tres documentos de trabajo acerca de los determinantes históricos, económicos y políticos de la distribución del ingreso, y un libro, con una explicación interdisciplinaria de las razones de la inequidad y su persistencia en el Perú. La investigación pertenece a la temática 'Derechos y Desarrollo Humanos', en el rubro de 'inequidades sociales', de la convocatoria del VRI. Así mismo, corresponde a uno de los valores fundamentales para la relación internacional en el siglo XXI formulada en la Declaración del Milenio (PNUD 2000): la igualdad.\n\nDesigualdad social; Herencia colonial; Economía política; Perú\n\nSocial sciences; Social sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "148"}, {"title": "TRAZADO DE UNA VÍA SUBTERRÁNEA QUE CRUZA EL CENTRO HISTÓRICO DE LIMA PROTEGIENDO EL PATRIMONIO CULTURAL", "year": "2012", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Arquitectura", "executing_section": "Arquitectura", "funding_type": "INTERNO", "research_lines": [], "text": "El proyecto es innovador, pues conjuga teorías matemáticas como la topología, teoría de grafos y geometría computacional junto con variables de arquitectura y valora el cuidado del patrimonio cultural. El proyecto también contribuye a la formación investigadores en ciencias aplicadas que sean capaces de conjugar distintas ramas del conocimiento en la solución de un problema real.\n\nInfraestructura subterránea; Centro Histórico de Lima; Patrimonio cultural; Movilidad urbana\n\nSocial sciences", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "215"}, {"title": "PRESENTE, PASADO Y FUTURO DE DOS CONJUNTOS MONÁSTICOS LIMEÑOS .", "year": "2013", "project_type": "básica y aplicada", "knowledge_area": "", "executing_unit": "Departamento de Arquitectura", "executing_section": "Arquitectura", "funding_type": "INTERNO", "research_lines": [], "text": "El proyecto consiste en el estudio de la configuración, desarrollo y relevancia histórica de dos monasterios ubicados en los Barrios Altos de Lima, a través de investigaciones exhaustivas de archivo confrontadas con la información de estado actual obtenida en campo, a través del análisis arquitectónico y fotográfico. Los dos monasterios fueron elegidos por ser casos paradigmáticos en términos históricos, sociales, tipológicos y patrimoniales. Así mismo se trata de desarrollar un modelo que nos permita analizar por contraste otros conjuntos monásticos del casco histórico, poniendo en relieve su problemática general, sus posibilidades, importancia y valores. Los dos conjuntos monumentales que se ha elegido trabajar son recintos de vida contemplativa. El primero es el monasterio de Nuestra Señora de la Peña de Francia, fundado en 1605, es segundo es el monasterio de las Concepcionistas Descalzas de Nuestro Señor San Joseph, fundado en 1603. La cuarta y la quinta fundación monástica de la ciudad de Los Reyes. Ambas fundaciones relacionadas por la voluntad del santo arzobispo Toribio Alfonso de Mogrovejo, e insertas en un contexto actualmente degradado. Ambos conjuntos forman parte de una de las áreas más densamente ocupadas por arquitectura religiosa del periodo virreinal en nuestro país, y sus características y valores patrimoniales los colocan entre los edificios más logrados de su tipo. Sin embargo, una serie de desafortunadas circunstancias que también serán objeto de este estudio han actuado en forma concurrente para desencadenar su gradual deterioro hasta encontrarse hoy en serio y latente peligro de irremisible destrucción.\n\nConjuntos monásticos; Patrimonio religioso; Historia urbana; Lima\n\nHumanities", "text_sources": ["cris_abstract", "cris_keywords", "cris_fos"], "project_id": "370"}], "project_topics": [{"project_id": "872", "title": "MODELIZACIÓN MATEMÁTICA Y TECNOLOGÍA DIGITAL: UNA PROPUESTA PARA FAVORECER LA ARTICULACIÓN DE LOS DOMINIOS DE LA GEOMETRÍA Y DEL ANÁLISIS EN LA FORMACIÓN CONTINUA DEL PROFESOR.", "executing_unit": "Departamento de Ciencias", "knowledge_area": "Ciencias Naturales", "year": "2019", "topics": [{"topic": "Modelización matemática y tecnología digital en la enseñanza", "description": "Integra modelización matemática y tecnología digital para articular geometría y análisis en la formación continua de profesores.", "evidence": "integre la modelización matemática y la tecnología digital en una propuesta para favorecer la articulación de los dominios de la geometría y del análisis en la formación continua del profesor de matemática", "confidence": 0.95}, {"topic": "Formación continua de docentes de matemática", "description": "Marco teórico (Espacio de Trabajo Matemático, Ingeniería Didáctica) orientado a fortalecer la formación de profesores de matemática con mirada internacional.", "evidence": "contribuir con la formación continua de profesores de matemática mediante un trabajo que tiene una mirada internacional", "confidence": 0.9}]}, {"project_id": "139", "title": "MODELOS DE REGRESION EN EL INTERVALO UNITARIO CON APLICACIONES EN EL ANÁLISIS DE RESULTADOS ELECTORALES", "executing_unit": "Departamento de Ciencias", "knowledge_area": "", "year": "2011", "topics": [{"topic": "Modelos estadísticos de regresión para datos limitados", "description": "Desarrollo de modelos de regresión en el intervalo unitario para datos con exceso de ceros y censura.", "evidence": "desarrollar modelos de regresión para variables en el intervalo unitario que contemple la regresión binaria y la regresión de proporciones con respuesta limitada y con exceso de ceros", "confidence": 0.95}, {"topic": "Análisis estadístico de resultados electorales", "description": "Aplicación de los modelos de regresión al análisis de proporciones de votación por partido a nivel subnacional.", "evidence": "modelar la proporción obtenida por un determinado partido o movimiento político en una determinada elección a nivel de departamentos, provincias y distritos", "confidence": 0.9}]}, {"project_id": "547", "title": "CARACTERIZACIÓN ÓPTICA Y DE EMISIÓN ÓPTICA DE PELÍCULAS DELGADAS AMORFAS DE MATERIALES SEMICONDUCTORES CON UN AMPLIO ANCHO DE BANDA SIC:H, ALN, SIN DOPADAS CON TIERRAS RARAS PARA APLICACIONES OPTOELECTRÓNICAS.", "executing_unit": "Departamento de Ciencias", "knowledge_area": "", "year": "2014", "topics": [{"topic": "Materiales semiconductores de amplio ancho de banda", "description": "Estudio de nitruros (Si3N4, AlN) por sus propiedades ópticas y térmicas frente a semiconductores convencionales.", "evidence": "materiales con un amplio ancho de banda como nitruro de silicio (Si3N4) o nitruro de aluminio (AlN) son de creciente interés en investigación y desarrollo para aplicaciones ópticas", "confidence": 0.93}, {"topic": "Dopaje con tierras raras para emisión óptica", "description": "Dopaje de semiconductores amorfos con iones de tierras raras para lograr emisión de luz en colores básicos.", "evidence": "al dopar estos semiconductores con iones de tierras raras también permiten la emisión de luz a temperatura de ambiente, cubriendo por ejemplo los colores básicos azul (Tm3+), verde (Tb3+) y rojo (Eu3+)", "confidence": 0.92}]}, {"project_id": "805", "title": "ELABORACION DE NUEVOS HIDROGELES SENSIBLES A LA TEMPERATURA Y AL PH CON ESTABILIDAD MECANICA", "executing_unit": "Departamento de Ciencias", "knowledge_area": "Ciencias Naturales", "year": "2017", "topics": [{"topic": "Hidrogeles inteligentes sensibles a estímulos", "description": "Síntesis de hidrogeles responsivos a temperatura y pH con estabilid     const state = {
      query: '',
      normFilter: '',
      selectedTopicKey: '',
      selectedNorm: '',
    };

    const projectsById = new Map(DATA.projects.map(p => [p.project_id, p]));
    const topicsByProject = new Map(DATA.project_topics.map(item => [item.project_id, item]));
    const normsByName = new Map(DATA.normalized_topics.map(item => [item.normalized_topic, item]));
    const variantToNorm = new Map();
    DATA.normalized_topics.forEach(norm => {
      norm.variants.forEach(variant => variantToNorm.set(variant, norm.normalized_topic));
    });

    function normalizeText(value) {
      return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function topicKey(projectId, topic) {
      return `${projectId}::${topic}`;
    }

    function topicMatches(item, topic) {
      const normName = variantToNorm.get(topic.topic) || '';
      const haystack = normalizeText([
        item.project_id,
        item.executing_unit,
        item.title,
        topic.topic,
        topic.description,
        topic.evidence,
        normName
      ].join(' '));
      const matchesQuery = !state.query || haystack.includes(normalizeText(state.query));
      const matchesNorm = !state.normFilter || normName === state.normFilter;
      return matchesQuery && matchesNorm;
    }

    function renderStats() {
      const totalTopics = DATA.project_topics.reduce((sum, item) => sum + item.topics.length, 0);
      document.getElementById('statProjects').textContent = DATA.projects.length;
      document.getElementById('statTopics').textContent = totalTopics;
      document.getElementById('statNorms').textContent = DATA.normalized_topics.length;
      document.getElementById('metaNote').textContent = DATA.metadata.note || '';
    }

    function renderFilterOptions() {
      const select = document.getElementById('normFilter');
      DATA.normalized_topics.forEach(norm => {
        const option = document.createElement('option');
        option.value = norm.normalized_topic;
        option.textContent = norm.normalized_topic;
        select.appendChild(option);
      });
    }

    function renderProjects() {
      const root = document.getElementById('projectTree');
      root.innerHTML = '';

      let visibleProjects = 0;
      DATA.project_topics.forEach(item => {
        const visibleTopics = item.topics.filter(topic => topicMatches(item, topic));
        if (!visibleTopics.length) return;
        visibleProjects += 1;

        const div = document.createElement('div');
        div.className = 'proj open';
        div.dataset.projectId = item.project_id;

        const topicCount = visibleTopics.length;
        div.innerHTML = `
          <button class="proj-header" type="button">
            <span>
              <span class="proj-title">${escapeHtml(item.title)}</span>
              <span class="proj-meta">#${escapeHtml(item.project_id)} · ${escapeHtml(item.executing_unit || 'sin unidad')} · ${escapeHtml(item.year)}</span>
            </span>
            <span class="pill">${topicCount}</span>
          </button>
          <div class="topic-list"></div>
        `;

        const list = div.querySelector('.topic-list');
        visibleTopics.forEach(topic => {
          const row = document.createElement('div');
          const key = topicKey(item.project_id, topic.topic);
          row.className = 'topic-row' + (state.selectedTopicKey === key ? ' active' : '');
          row.dataset.key = key;
          row.textContent = topic.topic;
          row.addEventListener('click', () => selectExtractedTopic(item, topic));
          list.appendChild(row);
        });

        div.querySelector('.proj-header').addEventListener('click', () => {
          div.classList.toggle('open');
        });

        root.appendChild(div);
      });

      if (!visibleProjects) {
        root.innerHTML = '<div class="empty">No hay proyectos que coincidan con la búsqueda o filtro.</div>';
      }
    }

    function renderNormalized() {
      const root = document.getElementById('normalPanel');
      root.innerHTML = '<div class="normalized-grid"></div>';
      const grid = root.querySelector('.normalized-grid');
      const query = normalizeText(state.query);
      let visible = 0;

      DATA.normalized_topics.forEach(norm => {
        const haystack = normalizeText([
          norm.normalized_topic,
          norm.description,
          norm.variants.join(' '),
          norm.executing_units.join(' ')
        ].join(' '));
        if (state.normFilter && norm.normalized_topic !== state.normFilter) return;
        if (query && !haystack.includes(query)) return;
        visible += 1;

        const card = document.createElement('article');
        card.className = 'norm-card' + (state.selectedNorm === norm.normalized_topic ? ' active' : '');
        card.innerHTML = `
          <h3>${escapeHtml(norm.normalized_topic)}</h3>
          <div class="norm-meta">
            <span class="mini">${norm.count} variantes</span>
            <span class="mini">${norm.project_ids.length} proyectos</span>
            <span class="mini">conf. ${norm.avg_confidence}</span>
          </div>
        `;
        card.addEventListener('click', () => selectNormalizedTopic(norm));
        grid.appendChild(card);
      });

      if (!visible) {
        root.innerHTML = '<div class="empty">No hay temas normalizados que coincidan.</div>';
      }
    }

    function selectExtractedTopic(item, topic) {
      const normName = variantToNorm.get(topic.topic);
      const norm = normsByName.get(normName);
      state.selectedTopicKey = topicKey(item.project_id, topic.topic);
      state.selectedNorm = normName || '';
      renderProjects();
      renderNormalized();
      renderFlowForTopic(item, topic, norm);
    }

    function selectNormalizedTopic(norm) {
      state.selectedTopicKey = '';
      state.selectedNorm = norm.normalized_topic;
      renderProjects();
      renderNormalized();
      renderFlowForNorm(norm);
    }

    function renderFlowForTopic(item, topic, norm) {
      const panel = document.getElementById('flowPanel');
      panel.innerHTML = `
        <div class="flow-card">
          <div class="label">Fuente de datos</div>
          <h3>${escapeHtml(DATA.metadata.dataset_title)}</h3>
          <p>${escapeHtml(DATA.metadata.source_file)}</p>
        </div>
        <div class="arrow">↓</div>
        <div class="flow-card">
          <div class="label">Proyecto</div>
          <h3>${escapeHtml(item.title)}</h3>
          <p>#${escapeHtml(item.project_id)} · ${escapeHtml(item.executing_unit || 'sin unidad')} · ${escapeHtml(item.year)}</p>
        </div>
        <div class="arrow">↓</div>
        <div class="flow-card">
          <div class="label">Tema extraído</div>
          <h3>${escapeHtml(topic.topic)}</h3>
          <p>${escapeHtml(topic.description)}</p>
          <div class="evidence">${escapeHtml(topic.evidence)}</div>
          <div class="confidence">confianza: ${topic.confidence}</div>
        </div>
        <div class="arrow">↓</div>
        <div class="flow-card">
          <div class="label">Tema normalizado</div>
          <h3>${escapeHtml(norm ? norm.normalized_topic : 'Sin normalización')}</h3>
          <p>${escapeHtml(norm ? norm.description : '')}</p>
          ${norm ? `<div class="chips">${norm.project_ids.map(id => `<span class="chip">#${escapeHtml(id)}</span>`).join('')}</div>` : ''}
        </div>
      `;
    }

    function renderFlowForNorm(norm) {
      const panel = document.getElementById('flowPanel');
      const evidences = norm.evidences.slice(0, 10).map(ev => `
        <li>
          <strong>#${escapeHtml(ev.project_id)}</strong> · ${escapeHtml(ev.title)}<br>
          <span>${escapeHtml(ev.topic)}</span>
        </li>
      `).join('');
      panel.innerHTML = `
        <div class="flow-card">
          <div class="label">Tema normalizado</div>
          <h3>${escapeHtml(norm.normalized_topic)}</h3>
          <p>${escapeHtml(norm.description)}</p>
          <div class="chips">
            <span class="chip">${norm.count} temas extraídos</span>
            <span class="chip">${norm.project_ids.length} proyectos</span>
            <span class="chip">confianza media ${norm.avg_confidence}</span>
          </div>
        </div>
        <div class="arrow">↑</div>
        <div class="flow-card">
          <div class="label">Variantes agrupadas</div>
          <ul class="variant-list">
            ${norm.variants.map(variant => `<li>${escapeHtml(variant)}</li>`).join('')}
          </ul>
        </div>
        <div class="arrow">↑</div>
        <div class="flow-card">
          <div class="label">Proyectos conectados</div>
          <p>${escapeHtml(norm.executing_units.join(' · '))}</p>
          <div class="chips">${norm.project_ids.map(id => `<span class="chip">#${escapeHtml(id)}</span>`).join('')}</div>
        </div>
        <div class="arrow">↑</div>
        <div class="flow-card">
          <div class="label">Primeras evidencias</div>
          <ul class="variant-list">${evidences}</ul>
        </div>
      `;
    }

    function renderAll() {
      renderProjects();
      renderNormalized();
    }

    document.getElementById('searchBox').addEventListener('input', event => {
      state.query = event.target.value.trim();
      renderAll();
    });

    document.getElementById('normFilter').addEventListener('change', event => {
      state.normFilter = event.target.value;
      state.selectedTopicKey = '';
      state.selectedNorm = event.target.value;
      renderAll();
      if (state.selectedNorm) {
        renderFlowForNorm(normsByName.get(state.selectedNorm));
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state.query = '';
      state.normFilter = '';
      state.selectedTopicKey = '';
      state.selectedNorm = '';
      document.getElementById('searchBox').value = '';
      document.getElementById('normFilter').value = '';
      document.getElementById('flowPanel').innerHTML = '<div class="empty">Selecciona un tema extraído o un tema normalizado para ver su trazabilidad.</div>';
      renderAll();
    });

    renderStats();
    renderFilterOptions();
    renderAll();
  </script>
</body>
</html>
